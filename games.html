<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منطقة الألعاب التعليمية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --green: #34d399;
            --text: #f8fafc;
        }
        body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: var(--card); border-radius: 16px; padding: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .btn { background: var(--green); color: #000; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; }
        .game-box { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .close-btn { position: absolute; top: 20px; right: 20px; background: #ef4444; color: #fff; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; }
        .game-content { background: var(--card); padding: 30px; border-radius: 20px; text-align: center; max-width: 500px; width: 100%; }
        input { padding: 10px; border-radius: 8px; border: none; font-size: 1.2rem; text-align: center; width: 100px; margin: 10px; }
    </style>
</head>
<body>

    <h1 style="text-align: center; margin-bottom: 30px;">🎮 الألعاب التعليمية والذكاء</h1>

    <div class="grid">
        <!-- لعبة 1 -->
        <div class="card">
            <h3>🧮 تحدي الجمع السريع</h3>
            <p>اختبر سرعة حسابك في الرياضيات!</p>
            <button class="btn" onclick="startMathGame()">العب الآن</button>
        </div>

        <!-- لعبة 2 -->
        <div class="card">
            <h3>🧠 اختبار الذاكرة بالأرقام</h3>
            <p>تذكر الرقم واكتبه بسرعة!</p>
            <button class="btn" onclick="startMemoryGame()">العب الآن</button>
        </div>
    </div>

    <!-- نافذة اللعبة -->
    <div class="game-box" id="gameModal">
        <button class="close-btn" onclick="closeGame()">إغلاق ✖</button>
        <div class="game-content" id="gameContainer"></div>
    </div>

    <script>
        function closeGame() {
            document.getElementById('gameModal').style.style.display = 'none';
            document.getElementById('gameModal').style.display = 'none';
        }

        // لعبة الرياضيات
        function startMathGame() {
            let n1 = Math.floor(Math.random() * 20) + 1;
            let n2 = Math.floor(Math.random() * 20) + 1;
            let ans = n1 + n2;

            document.getElementById('gameContainer').innerHTML = `
                <h2>ما هو حاصل جمع:</h2>
                <h1 style="color:var(--accent); font-size:3rem;">${n1} + ${n2}</h1>
                <input type="number" id="userAns" autofocus>
                <br>
                <button class="btn" onclick="checkMath(${ans})">إرسال الإجابة</button>
                <p id="res"></p>
            `;
            document.getElementById('gameModal').style.display = 'flex';
        }

        function checkMath(correctAns) {
            let val = parseInt(document.getElementById('userAns').value);
            let res = document.getElementById('res');
            if(val === correctAns) {
                res.innerHTML = "<b style='color:#34d399;'>إجابة صحيحة! أحسنت 🥳</b>";
                setTimeout(startMathGame, 1500);
            } else {
                res.innerHTML = "<b style='color:#ef4444;'>إجابة خاطئة، حاول مرة أخرى ❌</b>";
            }
        }

        // لعبة الذاكرة
        function startMemoryGame() {
            let num = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('gameContainer').innerHTML = `
                <h2>احفظ الرقم التالي بسرعة:</h2>
                <h1 style="color:var(--accent); font-size:3.5rem;" id="memNum">${num}</h1>
            `;
            document.getElementById('gameModal').style.display = 'flex';

            setTimeout(() => {
                document.getElementById('gameContainer').innerHTML = `
                    <h2>اكتب الرقم الذي ظهر لك:</h2>
                    <input type="number" id="userMem">
                    <br>
                    <button class="btn" onclick="checkMem(${num})">تحقق</button>
                    <p id="resMem"></p>
                `;
            }, 2000);
        }

        function checkMem(correctNum) {
            let val = parseInt(document.getElementById('userMem').value);
            let res = document.getElementById('resMem');
            if(val === correctNum) {
                res.innerHTML = "<b style='color:#34d399;'>ذاكرة ممتازة! إجابة صحيحة 🎉</b>";
                setTimeout(startMemoryGame, 1500);
            } else {
                res.innerHTML = `<b style='color:#ef4444;'>خاطئ! الرقم كان ${correctNum} ❌</b>`;
            }
        }
    </script>
</body>
</html>
