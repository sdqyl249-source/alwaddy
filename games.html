<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الألعاب التعليمية - منصة الوادي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #10b981;
            --danger: #ef4444;
            --dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark);
            color: var(--text-light);
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn-home {
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .game-container {
            max-width: 850px;
            margin: 0 auto;
            width: 100%;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .game-stats {
            display: flex;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.6);
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-item { display: flex; align-items: center; gap: 8px; font-size: 16px; }

        .subject-select, .level-select {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-option {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .btn-option i { font-size: 24px; color: #a5b4fc; }

        .btn-option:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: translateY(-3px);
        }

        .question-box {
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            margin: 25px 0;
            padding: 20px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 12px;
            border-right: 4px solid var(--primary);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-answer {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.05rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-answer:hover {
            background: rgba(99, 102, 241, 0.3);
            border-color: var(--primary);
        }

        .feedback-msg {
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 15px;
            min-height: 25px;
        }

        .leaderboard-section {
            margin-top: 35px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
        }

        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .admin-btn {
            background: none;
            border: 1px dashed #64748b;
            color: #94a3b8;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .leaderboard-list { list-style: none; padding: 0; margin: 0; }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.5);
            padding: 12px 18px;
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn-delete {
            background: var(--danger);
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            display: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }

        .btn-reward {
            background: var(--secondary);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            display: inline-block;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="index.html" class="btn-home"><i class="fa-solid fa-house"></i> الرئيسية</a>
        <h3 style="margin:0;"><i class="fa-solid fa-gamepad" style="color: #f59e0b;"></i> الألعاب التعليمية - منصة الوادي</h3>
    </div>

    <div class="game-container">
        <div class="game-stats">
            <div class="stat-item"><i class="fa-solid fa-heart" style="color:#ef4444;"></i> المحاولات: <span id="lives">3</span></div>
            <div class="stat-item"><i class="fa-solid fa-trophy" style="color:#f59e0b;"></i> النقاط: <span id="score">0</span></div>
            <div class="stat-item"><i class="fa-solid fa-book-open" style="color:#6366f1;"></i> المادة: <span id="current-subject">لم تحدد</span></div>
        </div>

        <!-- اختيار المادة -->
        <div id="subject-section">
            <h3 style="text-align: center; margin-bottom: 20px;">اختر المادة التعليمية 🎮</h3>
            <div class="subject-select">
                <button class="btn-option" onclick="selectSubject('الرياضيات')"><i class="fa-solid fa-calculator"></i>الرياضيات</button>
                <button class="btn-option" onclick="selectSubject('العربية')"><i class="fa-solid fa-font"></i>اللغة العربية</button>
                <button class="btn-option" onclick="selectSubject('العلوم')"><i class="fa-solid fa-flask"></i>العلوم</button>
                <button class="btn-option" onclick="selectSubject('الانكليزي')"><i class="fa-solid fa-language"></i>English</button>
                <button class="btn-option" onclick="selectSubject('الاسلامية')"><i class="fa-solid fa-kaaba"></i>الإسلامية</button>
                <button class="btn-option" onclick="selectSubject('الاجتماعيات')"><i class="fa-solid fa-earth-americas"></i>الاجتماعيات</button>
                <button class="btn-option" onclick="selectSubject('البازل')"><i class="fa-solid fa-puzzle-piece"></i>الذكاء والبازل</button>
            </div>
        </div>

        <!-- اختيار المستوى -->
        <div id="level-section" style="display: none;">
            <h3 style="text-align: center; margin-bottom: 20px;">اختر المستوى المناسب 🎯</h3>
            <div class="level-select">
                <button class="btn-option" onclick="selectLevel('easy')">🟢 سهل (الأول الابتدائي)</button>
                <button class="btn-option" onclick="selectLevel('medium')">🟡 متوسط (الثالث الابتدائي)</button>
                <button class="btn-option" onclick="selectLevel('hard')">🔴 صعب (السادس الابتدائي)</button>
            </div>
        </div>

        <!-- منطقة الأسئلة -->
        <div id="quiz-section" style="display: none;">
            <div class="question-box" id="question-text">جاري تحميل السؤال...</div>
            <div class="options-grid" id="options-container"></div>
            <div class="feedback-msg" id="feedback-msg"></div>
        </div>

        <!-- لوحة المتصدرين -->
        <div class="leaderboard-section">
            <div class="leaderboard-header">
                <h3>🏆 لوحة المتصدرين الحقيقية</h3>
                <button class="admin-btn" onclick="activateAdminMode()"><i class="fa-solid fa-user-shield"></i> إدارة الإزالة</button>
            </div>
            <ul class="leaderboard-list" id="leaderboard-list"></ul>
        </div>
    </div>

    <div class="modal" id="reward-modal">
        <div class="modal-content">
            <h2 style="color: #ef4444; margin-top:0;">💔 انتهت محاولاتك!</h2>
            <p>انقر على الزر بالأسفل لاستعادة 3 محاولات جديدة لمتابعة اللعب والحفاظ على نقاطك الحالية!</p>
            <button class="btn-reward" onclick="grantExtraLives()"><i class="fa-solid fa-play"></i> استعادة 3 محاولات الآن</button>
        </div>
    </div>

    <script>
        // قاعدة أسئلة موسعة
        const staticQuestions = {
            'الرياضيات': {
                easy: [
                    { q: "كم يساوي: 3 + 2 ؟", a: ["5", "4", "6", "3"], c: 0 },
                    { q: "كم يساوي: 7 - 3 ؟", a: ["4", "2", "5", "3"], c: 0 },
                    { q: "العدد التالي للعدد 8 هو:", a: ["9", "7", "10", "6"], c: 0 }
                ],
                medium: [
                    { q: "حاصل ضرب: 5 × 4 = ؟", a: ["20", "15", "25", "18"], c: 0 },
                    { q: "كم يساوي: 36 ÷ 6 ؟", a: ["6", "5", "7", "8"], c: 0 }
                ],
                hard: [
                    { q: "احسب النتيجة: (12 ÷ 3) + 6 = ؟", a: ["10", "12", "8", "14"], c: 0 },
                    { q: "مربع العدد 5 يساوي:", a: ["25", "20", "15", "30"], c: 0 }
                ]
            },
            'العربية': {
                easy: [
                    { q: "ما الحرف الأول في كلمة (مَدْرَسَة)؟", a: ["م", "د", "ر", "س"], c: 0 },
                    { q: "كلمة (شَمْس) تبدأ بحرف:", a: ["ش", "س", "ص", "ض"], c: 0 }
                ],
                medium: [
                    { q: "كلمة (يَكْتُبُ) هي:", a: ["فعل مضارع", "اسم", "حرف", "فعل أمر"], c: 0 },
                    { q: "جمع كلمة (كِتَاب) هو:", a: ["كُتُب", "كُتّاب", "مَكْتَبَة", "كِتَابَات"], c: 0 }
                ],
                hard: [
                    { q: "علامة رفع الفاعل الأصلية هي:", a: ["الضمة", "الفتحة", "الكسرة", "السكون"], c: 0 },
                    { q: "إنّ وأخواتها تدخل على الجملة الاسمية فـ:", a: ["تنصب المبتدأ وترفع الخبر", "ترفع المبتدأ وتنصب الخبر", "تجر الطرفين", "تتركهما مرفوعين"], c: 0 }
                ]
            },
            'العلوم': {
                easy: [
                    { q: "أي مما يلي كائن حي؟", a: ["الشجرة", "الحجر", "القلم", "السيارة"], c: 0 },
                    { q: "ما هو عضو التنفس عند الإنسان؟", a: ["الرئة", "القلب", "المعدة", "العين"], c: 0 }
                ],
                medium: [
                    { q: "تتحول المادة السائلة إلى غازية عن طريق:", a: ["التبخر", "التجمد", "التكثف", "الإنصهار"], c: 0 }
                ],
                hard: [
                    { q: "العضو المسؤول عن تنقية الدم في جسم الإنسان هو:", a: ["الكلية", "القلب", "الكبد", "الطحال"], c: 0 }
                ]
            },
            'الانكليزي': {
                easy: [
                    { q: "معنى كلمة (Apple) باللغة العربية:", a: ["تفاحة", "موزة", "برتقالة", "عنب"], c: 0 },
                    { q: "معنى كلمة (Dog) هو:", a: ["كلب", "قطة", "أسد", "طير"], c: 0 }
                ],
                medium: [
                    { q: "جمع كلمة (Child) هو:", a: ["Children", "Childs", "Childes", "Childing"], c: 0 }
                ],
                hard: [
                    { q: "الماضي من الفعل (Go) هو:", a: ["Went", "Gone", "Going", "Goes"], c: 0 }
                ]
            },
            'الاسلامية': {
                easy: [
                    { q: "كم عدد أركان الإسلام؟", a: ["5", "6", "4", "3"], c: 0 },
                    { q: "ما هي القبلة المسلمين عند الصلاة؟", a: ["الكعبة المشرفة", "المسجد الأقصى", "الروضة الشريفة", "مكة المكرمة"], c: 0 }
                ],
                medium: [
                    { q: "الصلاة التي ليس فيها ركوع ولا سجود هي صلاة:", a: ["الجنازة", "العيد", "الجمعة", "الاستسقاء"], c: 0 }
                ],
                hard: [
                    { q: "أول غزوة في الإسلام هي غزوة:", a: ["الأبواء (ودان)", "بدر", "أحد", "الخندق"], c: 0 }
                ]
            },
            'الاجتماعيات': {
                easy: [
                    { q: "تشرق الشمس من جهة:", a: ["الشرق", "الغرب", "الشمال", "الجنوب"], c: 0 }
                ],
                medium: [
                    { q: "عاصمة العراق هي مدينة:", a: ["بغداد", "البصرة", "أربيل", "الموصل"], c: 0 }
                ],
                hard: [
                    { q: "يمر نهر الدجلة والفرات ببلاد الرافدين، أين يتقيان لتكوين شط العرب؟", a: ["القرنة", "الكوت", "العمارة", "الناصرية"], c: 0 }
                ]
            },
            'البازل': {
                easy: [
                    { q: "ما الشكل الذي يحتوي على 3 أضلاع؟", a: ["المثلث", "المربع", "الدائرة", "المستطيل"], c: 0 }
                ],
                medium: [
                    { q: "أكمل النمط: 2 ، 4 ، 6 ، ... ؟", a: ["8", "7", "9", "10"], c: 0 }
                ],
                hard: [
                    { q: "إذا كان عقرب الساعات على 3 وعقرب الدقائق على 12، فكم الساعة؟", a: ["الثالثة تماماً", "الرابعة", "الثانية", "السادسة"], c: 0 }
                ]
            }
        };

        let currentSubject = '';
        let currentLevel = '';
        let score = 0;
        let lives = 3;
        let isAdmin = false;
        let currentQuestionIndex = 0;
        let activeQuestionsList = [];

        let leaderboard = JSON.parse(localStorage.getItem('alwaddy_leaderboard')) || [
            { name: "علي الحسين", score: 150 },
            { name: "فاطمة الزهراء", score: 110 }
        ];

        function selectSubject(subject) {
            currentSubject = subject;
            document.getElementById('current-subject').innerText = subject;
            document.getElementById('subject-section').style.display = 'none';
            document.getElementById('level-section').style.display = 'block';
        }

        function selectLevel(level) {
            currentLevel = level;
            document.getElementById('level-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'block';
            
            prepareQuestionPool();
            currentQuestionIndex = 0;
            loadNextQuestion();
        }

        function prepareQuestionPool() {
            activeQuestionsList = [];
            if (staticQuestions[currentSubject] && staticQuestions[currentSubject][currentLevel]) {
                activeQuestionsList = [...staticQuestions[currentSubject][currentLevel]];
            }

            // توليد أسئلة ديناميكية إضافية لضمان التجديد وعدم الانتهاء
            for (let i = 0; i < 20; i++) {
                if (currentSubject === 'الرياضيات') {
                    let num1 = Math.floor(Math.random() * (currentLevel === 'easy' ? 10 : currentLevel === 'medium' ? 50 : 100)) + 1;
                    let num2 = Math.floor(Math.random() * (currentLevel === 'easy' ? 10 : currentLevel === 'medium' ? 20 : 50)) + 1;
                    let correctAns = num1 + num2;
                    activeQuestionsList.push({
                        q: `كم يساوي: ${num1} + ${num2} ؟`,
                        a: [`${correctAns}`, `${correctAns + 2}`, `${correctAns - 1}`, `${correctAns + 5}`],
                        c: 0
                    });
                }
            }

            // خلط الأسئلة عشوائياً
            activeQuestionsList.sort(() => Math.random() - 0.5);
        }

        function loadNextQuestion() {
            document.getElementById('feedback-msg').innerText = '';

            if (lives <= 0) return;

            if (currentQuestionIndex >= activeQuestionsList.length) {
                prepareQuestionPool(); // إعادة تدوير وبناء بنك جديد عند انتهاء الأسئلة
                currentQuestionIndex = 0;
            }

            let currentQ = activeQuestionsList[currentQuestionIndex];
            document.getElementById('question-text').innerText = currentQ.q;
            
            // خلط الخيارات عشوائياً لضمان عدم ثبات الإجابة في الخيار الأول
            let optionsWithStatus = currentQ.a.map((opt, idx) => ({
                text: opt,
                isCorrect: idx === currentQ.c
            }));
            optionsWithStatus.sort(() => Math.random() - 0.5);

            renderOptions(optionsWithStatus);
        }

        function renderOptions(optionsArray) {
            let container = document.getElementById('options-container');
            container.innerHTML = '';

            optionsArray.forEach((optObj) => {
                let btn = document.createElement('button');
                btn.className = 'btn-answer';
                btn.innerText = optObj.text;
                btn.onclick = () => handleAnswer(optObj.isCorrect);
                container.appendChild(btn);
            });
        }

        function handleAnswer(isCorrect) {
            currentQuestionIndex++; // الانتقال التلقائي للسؤال التالي
            
            if (isCorrect) {
                score += (currentLevel === 'easy' ? 10 : currentLevel === 'medium' ? 20 : 30);
                document.getElementById('score').innerText = score;
                document.getElementById('feedback-msg').style.color = '#10b981';
                document.getElementById('feedback-msg').innerText = "إجابة صحيحة ممتازة! 🎉";
            } else {
                lives--;
                document.getElementById('lives').innerText = lives;
                document.getElementById('feedback-msg').style.color = '#ef4444';
                document.getElementById('feedback-msg').innerText = "إجابة خاطئة 💔";
                
                if (lives <= 0) {
                    setTimeout(() => showRewardModal(), 600);
                    return;
                }
            }

            // تحميل السؤال القادم بعد نصف ثانية
            setTimeout(() => {
                loadNextQuestion();
            }, 600);
        }

        function showRewardModal() {
            document.getElementById('reward-modal').style.display = 'flex';
        }

        function grantExtraLives() {
            lives = 3;
            document.getElementById('lives').innerText = lives;
            document.getElementById('reward-modal').style.display = 'none';
            saveScore();
            loadNextQuestion();
        }

        function saveScore() {
            let playerName = prompt("انتهت محاولاتك! أدخل اسمك لتسجيل نقاطك في القائمة:") || "تلميذ الوادي";
            leaderboard.push({ name: playerName, score: score });
            leaderboard.sort((a, b) => b.score - a.score);
            localStorage.setItem('alwaddy_leaderboard', JSON.stringify(leaderboard));
            renderLeaderboard();
        }

        function renderLeaderboard() {
            let list = document.getElementById('leaderboard-list');
            list.innerHTML = '';
            leaderboard.forEach((item, index) => {
                let li = document.createElement('li');
                li.className = 'leaderboard-item';
                li.innerHTML = `
                    <span><b>#${index + 1}</b> ${item.name}</span>
                    <span><b>${item.score}</b> نقطة
                    <button class="btn-delete" style="display:${isAdmin ? 'inline-block' : 'none'}" onclick="deletePlayer(${index})">حذف ❌</button></span>
                `;
                list.appendChild(li);
            });
        }

        function activateAdminMode() {
            let password = prompt("كلمة سر الإدارة لحذف اللاعبين المشاغبين:");
            if (password === "1234") {
                isAdmin = true;
                alert("تم تفعيل وضع الأدمن بنجاح!");
                renderLeaderboard();
            } else {
                alert("كلمة سر خاطئة!");
            }
        }

        function deletePlayer(index) {
            if (confirm("تأكيد حذف اللاعب من المتصدرين؟")) {
                leaderboard.splice(index, 1);
                localStorage.setItem('alwaddy_leaderboard', JSON.stringify(leaderboard));
                renderLeaderboard();
            }
        }

        renderLeaderboard();
    </script>

    <!-- كود إعلان Popunder -->
    <script src="https://pl30567936.effectivecpmnetwork.com/75/71/e0/7571e0e12a8e91b91d02f47ecb8b87ea.js"></script>

</body>
