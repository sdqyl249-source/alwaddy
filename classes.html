<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="icona99.png">
    <link rel="apple-touch-icon" href="icona99.png">
    <title>إدارة الصفوف - منصة الوادي</title>
    <link rel="stylesheet" href="classes_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            background-color: #f1f5f9; 
            color: #0f172a; 
        }

        /* القائمة الجانبية بالوضع الفاتح */
        .sidebar { 
            height: 100vh; 
            width: 0; 
            position: fixed; 
            top: 0; 
            right: 0; 
            background: #ffffff; 
            box-shadow: -5px 0 25px rgba(0,0,0,0.1); 
            transition: width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); 
            overflow-x: hidden; 
            z-index: 1000; 
            display: flex; 
            flex-direction: column; 
            padding: 20px 0; 
            border-left: 1px solid #e2e8f0; 
        }

        .sidebar-title { 
            color: #d97706; 
            font-size: 21px; 
            font-weight: bold; 
            padding-bottom: 20px; 
            border-bottom: 2px solid #f1f5f9; 
            margin-bottom: 15px; 
            text-align: center; 
            white-space: nowrap; 
        }

        .menu-item { 
            color: #334155; 
            background: #f8fafc; 
            border: 1px solid #e2e8f0; 
            border-radius: 12px; 
            margin: 8px 15px; 
            padding: 12px 18px; 
            text-align: center; 
            transition: 0.3s; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            white-space: nowrap; 
            font-weight: 600; 
            text-decoration: none; 
        }

        .menu-item i { color: #d97706; }

        .menu-item:hover { 
            background: #fef3c7; 
            color: #b45309; 
            border-color: #f59e0b; 
            transform: translateY(-2px); 
        }

        .logout-btn { 
            margin-top: auto; 
            padding: 12px; 
            background: #fee2e2; 
            color: #dc2626; 
            border: 1px solid #fca5a5; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: 0.3s; 
            font-weight: bold; 
            width: 80%; 
            margin: 20px auto; 
        }

        .logout-btn:hover { background: #dc2626; color: white; }

        .toggle-btn { 
            position: fixed; 
            top: 20px; 
            right: 20px; 
            z-index: 1002; 
            padding: 12px 22px; 
            cursor: pointer; 
            background: #ffffff; 
            color: #d97706; 
            border: 2px solid #f59e0b; 
            border-radius: 50px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
            font-weight: bold; 
            transition: 0.3s; 
        }

        .toggle-btn:hover {
            background: #f59e0b;
            color: #ffffff;
        }

        .main-content { 
            margin-right: 0; 
            padding: 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
            transition: 0.4s; 
        }

        @media (min-width: 768px) { .main-content { padding: 40px; } }

        /* ترويسة الصفحة */
        .page-title {
            color: #1e293b;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* لوحة التحكم للأدمن */
        #adminPanel {
            border: 2px dashed #f59e0b; 
            padding: 20px; 
            margin-bottom: 30px; 
            border-radius: 16px; 
            background: #ffffff; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            overflow-x: auto;
        }

        /* بطاقات الصفوف - ألوان زاهية غامقة */
        .class-card { 
            padding: 24px; 
            border-radius: 18px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.08); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            cursor: pointer; 
            color: #ffffff;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 140px;
        }

        /* تنويع التدرجات الزاهية الغامقة للبطاقات */
        .class-card:nth-child(4n+1) { background: linear-gradient(135deg, #1e3a8a, #3b82f6); }
        .class-card:nth-child(4n+2) { background: linear-gradient(135deg, #581c87, #8b5cf6); }
        .class-card:nth-child(4n+3) { background: linear-gradient(135deg, #064e3b, #10b981); }
        .class-card:nth-child(4n+4) { background: linear-gradient(135deg, #831843, #ec4899); }

        .class-card:hover { 
            transform: translateY(-6px); 
            box-shadow: 0 14px 28px rgba(0,0,0,0.18); 
        }

        .class-card h3 { 
            margin: 0 0 10px 0; 
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .class-card button { 
            padding: 8px 16px; 
            margin-left: 6px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        
        .class-card button:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        /* قسم الدردشة */
        #chatSection { 
            display: none; 
            margin-top: 20px; 
            background: #ffffff; 
            padding: 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            border: 1px solid #e2e8f0; 
        }

        @media (min-width: 768px) { #chatSection { padding: 30px; } }

        .chat-header-bar { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            justify-content: space-between; 
            align-items: flex-start; 
            margin-bottom: 20px; 
            border-bottom: 2px solid #f1f5f9; 
            padding-bottom: 15px; 
        }

        @media (min-width: 600px) { .chat-header-bar { flex-direction: row; align-items: center; } }

        .chat-wrapper { 
            display: flex; 
            flex-direction: column; 
            height: 450px; 
            border: 1px solid #cbd5e1; 
            border-radius: 16px; 
            background-color: #f8fafc; 
            overflow: hidden; 
        }

        @media (min-width: 768px) { .chat-wrapper { height: 500px; } }

        .chat-messages { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
        }

        .msg-bubble { 
            background: #ffffff; 
            padding: 14px 18px; 
            border-radius: 14px; 
            max-width: 85%; 
            word-break: break-word; 
            box-shadow: 0 3px 10px rgba(0,0,0,0.04); 
            font-size: 15px; 
            position: relative; 
            border: 1px solid #e2e8f0; 
            color: #1e293b;
        }

        @media (min-width: 768px) { .msg-bubble { max-width: 65%; } }

        /* رسائل الأستاذ / الإدارة بارزة بلون غامق زاهي */
        .msg-bubble.teacher-msg { 
            background: #1e3a8a; 
            color: #ffffff;
            border-right: 5px solid #3b82f6; 
            border-color: #1e3a8a; 
        }

        .msg-bubble.teacher-msg .msg-sender { color: #93c5fd; }
        .msg-bubble.teacher-msg .msg-text { color: #f8fafc; }
        .msg-bubble.teacher-msg .msg-actions span { color: #cbd5e1; }

        .msg-sender { 
            font-size: 13px; 
            font-weight: bold; 
            color: #d97706; 
            margin-bottom: 6px; 
            display: block; 
        }

        .msg-text { color: #334155; line-height: 1.6; }

        .msg-img { max-width: 100%; border-radius: 10px; margin-top: 8px; cursor: pointer; }

        .msg-actions { margin-top: 8px; font-size: 12px; display: flex; gap: 12px; justify-content: flex-end; }
        .msg-actions span { cursor: pointer; color: #64748b; transition: 0.2s; font-weight: 600; }
        .msg-actions span:hover { color: #ef4444; }

        .chat-input-area { 
            display: flex; 
            gap: 10px; 
            padding: 15px; 
            background: #ffffff; 
            border-top: 1px solid #e2e8f0; 
            align-items: center; 
            flex-wrap: wrap; 
        }

        @media (min-width: 600px) { .chat-input-area { flex-wrap: nowrap; } }

        .chat-input-area input[type="text"] { 
            flex-grow: 1; 
            width: 100%; 
            padding: 12px 16px; 
            border: 1px solid #cbd5e1; 
            border-radius: 10px; 
            font-size: 14px; 
            outline: none; 
            background: #f8fafc; 
            color: #0f172a; 
            transition: 0.2s;
        }

        .chat-input-area input[type="text"]:focus {
            border-color: #d97706;
            background: #ffffff;
        }

        @media (min-width: 600px) { .chat-input-area input[type="text"] { width: auto; } }

        .chat-input-area input[type="file"] { display: none; }

        .upload-btn-label { 
            background: #f1f5f9; 
            color: #475569; 
            padding: 12px 16px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: bold; 
            transition: 0.2s; 
            white-space: nowrap; 
            border: 1px solid #cbd5e1; 
        }

        .upload-btn-label:hover { background: #e2e8f0; color: #0f172a; }

        .admin-only { display: none; }
    </style>
</head>
<body>

<script>
const activeUserCheck = localStorage.getItem("currentUser");
if (!activeUserCheck) {
    window.location.href = "login.html";
}
</script>

<button class="toggle-btn" onclick="document.getElementById('mySidebar').style.width = '260px'; document.getElementById('sidebarOverlay').style.display = 'block';">
    <i class="fa-solid fa-bars"></i> القائمة
</button>

<div class="sidebar" id="mySidebar">
    <div class="sidebar-title">🏞️ منصة الوادي</div>
    <a href="index.html" class="menu-item"><i class="fa-solid fa-house"></i> الرئيسية</a>
    <a href="classes.html" class="menu-item"><i class="fa-solid fa-school"></i> إدارة الصفوف والدردشة</a>
    <a href="schedule.html" class="menu-item"><i class="fa-solid fa-clock"></i> الحصص والجداول</a>
    <a href="games.html" class="menu-item"><i class="fa-solid fa-gamepad"></i> الألعاب والترفيه</a>
    <a href="library.html" class="menu-item"><i class="fa-solid fa-book"></i> المكتبة الرقمية</a>
    <button onclick="localStorage.removeItem('currentUser'); window.location.href='login.html';" class="logout-btn">تسجيل الخروج</button>
</div>

<div onclick="document.getElementById('mySidebar').style.width = '0'; document.getElementById('sidebarOverlay').style.display = 'none';" style="position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:999; display:none;" id="sidebarOverlay"></div>

<div class="main-content">
    <h2 class="page-title"><i class="fa-solid fa-school" style="color: #d97706;"></i> إدارة الصفوف الدراسية</h2>

    <div id="adminPanel" class="admin-only">
        <h3 style="color: #b45309; margin-top: 0; font-size: 18px;"><i class="fa-solid fa-plus-circle"></i> إضافة صف جديد</h3>
        <div style="display: flex; gap: 15px; flex-wrap: wrap; align-items: center; margin-top: 10px;">
            <div>
                <label style="color: #475569; display: block; margin-bottom: 5px; font-weight: 600;">اسم الصف:</label>
                <select id="className" style="padding: 10px; background: #f8fafc; color: #0f172a; border: 1px solid #cbd5e1; border-radius: 8px; font-weight: 600;">
                    <option value="الاول">الاول</option>
                    <option value="الثاني">الثاني</option>
                    <option value="الثالث">الثالث</option>
                    <option value="الرابع">الرابع</option>
                    <option value="الخامس">الخامس</option>
                    <option value="السادس">السادس</option>
                </select>
            </div>
            <div>
                <label style="color: #475569; display: block; margin-bottom: 5px; font-weight: 600;">الشعبة:</label>
                <select id="classSection" style="padding: 10px; background: #f8fafc; color: #0f172a; border: 1px solid #cbd5e1; border-radius: 8px; font-weight: 600;">
                    <option value="أ">أ</option>
                    <option value="ب">ب</option>
                    <option value="ج">ج</option>
                    <option value="د">د</option>
                    <option value="هـ">هـ</option>
                </select>
            </div>
            <button id="saveClassBtn" style="padding: 10px 22px; background: #d97706; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 22px; box-shadow: 0 4px 10px rgba(217, 119, 6, 0.3);">حفظ الصف</button>
        </div>
    </div>

    <div class="dashboard-container" id="classesContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px;"></div>

    <div id="chatSection">
        <div class="chat-header-bar">
            <h3 id="currentChatTitle" style="margin: 0; color: #1e293b; font-size: 20px; font-weight: 700;">غرفة الدردشة للصف: <span style="color: #d97706;"></span></h3>
            <div id="toggleChatControl" class="admin-only">
                <button id="lockChatBtn" onclick="window.toggleChatStatus()" style="padding: 9px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s;"></button>
            </div>
        </div>

        <div class="chat-wrapper">
            <div id="chat-messages" class="chat-messages"></div>
            <div class="chat-input-area" id="chatInputAreaContainer">
                <label for="image-input" class="upload-btn-label"><i class="fa-solid fa-image"></i> صورة</label>
                <input type="file" id="image-input" accept="image/*">
                <input type="text" id="message-input" placeholder="اكتب رسالتك هنا...">
                <button id="send-btn" style="background: #d97706; color: white; border: none; padding: 12px 24px; border-radius: 10px; cursor: pointer; font-weight: bold; width: auto; box-shadow: 0 4px 12px rgba(217, 119, 6, 0.25);">إرسال</button>
            </div>
        </div>

        <button onclick="document.getElementById('chatSection').style.display='none'; document.getElementById('classesContainer').style.display='grid'; if(isAdmin) document.getElementById('adminPanel').style.display='block';" style="margin-top: 18px; background: #64748b; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s;">العودة لقائمة الصفوف</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<script>
document.querySelector('.toggle-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    document.getElementById('mySidebar').style.width = '260px';
    document.getElementById('sidebarOverlay').style.display = 'block';
});

document.getElementById('sidebarOverlay').addEventListener('click', () => {
    document.getElementById('mySidebar').style.width = '0';
    document.getElementById('sidebarOverlay').style.display = 'none';
});

const firebaseConfig = {
    apiKey: "AIzaSyAuWDpBoR31ZjPzaUrAe4lppufSHuMLFyI",
    databaseURL: "https://roya-platform-26860-default-rtdb.firebaseio.com",
    projectId: "roya-platform-26860",
    storageBucket: "roya-platform-26860.appspot.com",
    messagingSenderId: "897544406776",
    appId: "1:897544406776:web:aa112013dea672fb141d0d"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
window.database = firebase.database();

let activeChatId = "";
let chatListener = null;
let statusListener = null;
let isAdmin = false;
let currentUser = null;
let isChatLocked = false;

document.addEventListener('DOMContentLoaded', () => {
    try {
        currentUser = JSON.parse(localStorage.getItem("currentUser"));
        if (currentUser) {
            const userRole = currentUser.role ? currentUser.role.trim().toLowerCase() : "";
            if (userRole === 'teacher' || userRole === 'admin' || userRole === 'المدير' || userRole === 'الأستاذ') {
                isAdmin = true;
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
            }
            const header = document.querySelector('.page-title');
            const infoBox = document.createElement('div');
            infoBox.innerHTML = `<h4 style="color: #64748b; margin-top: -15px; margin-bottom: 25px; font-weight: 600;">مرحباً بك يا <span style="color: #d97706; font-weight: bold;">${currentUser.name}</span> (${currentUser.role || 'مستخدم'})</h4>`;
            header.parentNode.insertBefore(infoBox, header.nextSibling);
        }
    } catch(e) {}

    const container = document.getElementById("classesContainer");
    if (container && window.database) {
        window.database.ref('classes/').on('value', (snapshot) => {
            container.innerHTML = "";
            const data = snapshot.val();
            if (data) {
                Object.entries(data).forEach(([key, cls]) => {
                    const card = document.createElement("div");
                    card.className = "class-card";
                    let adminButtonsHTML = "";
                    if (isAdmin) {
                        adminButtonsHTML = `
                            <div style="margin-top: 15px;" onclick="event.stopPropagation();">
                                <button onclick="window.editClass('${cls.id}', '${cls.name}', '${cls.section}')" style="background: #ffffff; color: #b45309;">✏️ تعديل</button>
                                <button onclick="window.deleteClass('${cls.id}')" style="background: #ffffff; color: #dc2626;">🗑️ حذف</button>
                            </div>`;
                    }
                    card.innerHTML = `
                        <h3>${cls.name} - شعبة ${cls.section}</h3>
                        ${adminButtonsHTML}`;
                    card.onclick = () => {
                        window.openChat(cls.id, `${cls.name} - شعبة ${cls.section}`);
                    };
                    container.appendChild(card);
                });
            }
        });
    }

    const saveBtn = document.getElementById("saveClassBtn");
    if (saveBtn) {
        saveBtn.onclick = function() {
            const name = document.getElementById("className").value;
            const section = document.getElementById("classSection").value;
            const id = Math.floor(1000 + Math.random() * 9000).toString();
            window.database.ref('classes/' + id).set({
                id: id,
                name: name,
                section: section,
                isLocked: false
            }).then(() => {
                alert("تم حفظ الصف بنجاح!");
            }).catch((err) => {
                alert("خطأ أثناء الحفظ: " + err.message);
            });
        };
    }

    const sendBtn = document.getElementById("send-btn");
    const input = document.getElementById("message-input");
    const imageInput = document.getElementById("image-input");

    if (sendBtn && input) {
        sendBtn.onclick = () => {
            if (isChatLocked && !isAdmin) {
                alert("الدردشة مغلقة حالياً من قبل الأستاذ أو المدير، لا يمكنك إرسال رسائل.");
                return;
            }
            const file = imageInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = function() {
                    sendChatMessage(input.value.trim(), reader.result);
                    imageInput.value = "";
                };
                reader.readAsDataURL(file);
            } else {
                sendChatMessage(input.value.trim(), null);
            }
        };
        input.addEventListener("keypress", (e) => { if (e.key === "Enter") sendBtn.click(); });
    }
});

window.editClass = function(id, oldName, oldSection) {
    const newName = prompt("تعديل اسم الصف:", oldName);
    if (!newName) return;
    const newSection = prompt("تعديل الشعبة:", oldSection);
    if (!newSection) return;
    window.database.ref('classes/' + id).update({
        name: newName,
        section: newSection
    }).then(() => alert("تم التحديث بنجاح!"));
};

window.deleteClass = function(id) {
    if (confirm("هل أنت متأكد من حذف هذا الصف نهائياً؟")) {
        window.database.ref('classes/' + id).remove().then(() => alert("تم الحذف بنجاح"));
    }
};

window.openChat = function(classId, className) {
    activeChatId = classId;
    document.getElementById('currentChatTitle').querySelector('span').innerText = className;
    document.getElementById('classesContainer').style.display = 'none';
    const adminPanel = document.getElementById('adminPanel');
    if(adminPanel) adminPanel.style.display = 'none';
    document.getElementById('chatSection').style.display = 'block';

    const messagesContainer = document.getElementById('chat-messages');
    messagesContainer.innerHTML = "<p style='text-align:center; color:#64748b;'>جاري تحميل الرسائل...</p>";

    if (chatListener) {
        window.database.ref('chats/' + activeChatId).off('value', chatListener);
    }
    if (statusListener) {
        window.database.ref('classes/' + activeChatId + '/isLocked').off('value', statusListener);
    }

    statusListener = window.database.ref('classes/' + classId + '/isLocked').on('value', snapshot => {
        isChatLocked = snapshot.val() === true;
        const lockBtn = document.getElementById('lockChatBtn');
        const inputArea = document.getElementById('chatInputAreaContainer');
        if (isChatLocked) {
            if (lockBtn) {
                lockBtn.innerText = "🔓 فتح الدردشة للطلاب";
                lockBtn.style.background = "#ef4444";
                lockBtn.style.color = "white";
            }
            if (!isAdmin) {
                inputArea.style.display = 'none';
            } else {
                inputArea.style.display = 'flex';
            }
        } else {
            if (lockBtn) {
                lockBtn.innerText = "🔒 إغلاق الدردشة للطلاب";
                lockBtn.style.background = "#10b981";
                lockBtn.style.color = "white";
            }
            inputArea.style.display = 'flex';
        }
    });

    chatListener = window.database.ref('chats/' + classId).on('value', snapshot => {
        messagesContainer.innerHTML = "";
        const msgs = snapshot.val();
        if (msgs) {
            Object.entries(msgs).forEach(([msgId, m]) => {
                const bubble = document.createElement('div');
                const isTeacherMsg = m.role && (m.role.toLowerCase() === 'teacher' || m.role.toLowerCase() === 'admin' || m.role.includes('أستاذ') || m.role.includes('مدير'));
                bubble.className = isTeacherMsg ? 'msg-bubble teacher-msg' : 'msg-bubble';
                let contentHTML = `<span class="msg-sender">${m.sender} (${m.role || 'مستخدم'})</span>`;
                if (m.text) contentHTML += `<div class="msg-text">${m.text}</div>`;
                if (m.image) contentHTML += `<img src="${m.image}" class="msg-img" onclick="window.open('${m.image}')">`;
                
                let canModify = currentUser && (currentUser.name === m.sender || isAdmin);
                if (canModify) {
                    contentHTML += `
                        <div class="msg-actions">
                            ${m.text ? `<span onclick="window.editMessage('${msgId}', '${m.text.replace(/'/g, "\\'")}')">تعديل</span>` : ''}
                            <span onclick="window.deleteMessage('${msgId}')">حذف</span>
                        </div>`;
                }
                bubble.innerHTML = contentHTML;
                messagesContainer.appendChild(bubble);
            });
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        } else {
            messagesContainer.innerHTML = "<p style='color: #94a3b8; text-align:center;'>لا توجد رسائل بعد. كن أول المراسلتين!</p>";
        }
    });
};

window.toggleChatStatus = function() {
    if (!activeChatId) return;
    const newStatus = !isChatLocked;
    window.database.ref('classes/' + activeChatId).update({
        isLocked: newStatus
    }).then(() => {
        alert(newStatus ? "تم إغلاق الدردشة بنجاح (لا يمكن للطلاب الإرسال الآن)." : "تم فتح الدردشة بنجاح.");
    }).catch(err => {
        alert("حدث خطأ: " + err.message);
    });
};

function sendChatMessage(text, imageUrl) {
    if ((!text && !imageUrl) || !activeChatId) return;
    if (isChatLocked && !isAdmin) {
        alert("الدردشة مغلقة حالياً من قبل الأستاذ أو المدير.");
        return;
    }
    window.database.ref('chats/' + activeChatId).push({
        text: text || "",
        image: imageUrl || null,
        sender: currentUser ? currentUser.name : "مستخدم",
        role: currentUser ? currentUser.role : "طالب",
        timestamp: Date.now()
    }).then(() => {
        document.getElementById('message-input').value = "";
    }).catch(err => alert("فشل الإرسال: " + err.message));
}

window.deleteMessage = function(msgId) {
    if (confirm("هل تريد حذف هذه الرسالة؟")) {
        window.database.ref(`chats/${activeChatId}/${msgId}`).remove();
    }
};

window.editMessage = function(msgId, oldText) {
    const newText = prompt("تعديل الرسالة:", oldText);
    if (newText !== null && newText.trim() !== "") {
        window.database.ref(`chats/${activeChatId}/${msgId}`).update({
            text: newText.trim()
        });
    }
};
</script>
