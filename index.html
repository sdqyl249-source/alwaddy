<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="icona99.png">
    <title>الرئيسية - منصة رؤيا التعليمية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; }

        :root {
            --bg-color: #0b0f19;
            --text-color: #ffffff;
            --sidebar-bg: linear-gradient(180deg, #0f172a, #020617);
            --sidebar-border: rgba(246, 173, 85, 0.3);
            --news-card-bg: #333d4e;
            --news-card-title: #ffffff;
            --news-card-date: #a0aec0;
            --footer-bg: #0f172a;
            --footer-border: rgba(246, 173, 85, 0.2);
            --footer-text: #a0aec0;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; }
        
        .sidebar { height: 100vh; width: 0; position: fixed; top: 0; right: 0; background: var(--sidebar-bg); transition: 0.4s; overflow-x: hidden; z-index: 1000; padding: 20px 0; border-left: 1px solid var(--sidebar-border); }
        .sidebar-title { color: #f6ad55; font-size: 21px; font-weight: bold; padding-bottom: 20px; border-bottom: 2px solid var(--sidebar-border); margin-bottom: 15px; text-align: center; }
        .menu-item { color: #e2e8f0; background: rgba(246, 173, 85, 0.03); border: 1px solid rgba(246, 173, 85, 0.1); border-radius: 12px; margin: 8px 15px; padding: 12px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; }
        .logout-btn { background: rgba(229, 62, 62, 0.1); color: #ef4444; border: 1px solid rgba(229, 62, 62, 0.3); border-radius: 12px; cursor: pointer; padding: 12px; width: 80%; margin: 20px auto; display: block; }

        .top-buttons-container { position: fixed; top: 20px; right: 20px; z-index: 1002; }
        .toggle-btn { padding: 12px 20px; cursor: pointer; background: #0f172a; color: #f6ad55; border: 1px solid rgba(246, 173, 85, 0.3); border-radius: 50px; font-weight: bold; }

        .main-content { padding: 20px; max-width: 1300px; margin: 0 auto; width: 100%; flex: 1; }
        .dashboard-container { display: flex; flex-direction: column; gap: 25px; }

        .news-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .search-input { padding: 10px 15px; border-radius: 50px; border: 1px solid var(--sidebar-border); background: var(--news-card-bg); color: #fff; width: 250px; outline: none; }

        .news-grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .media-card { background-color: var(--news-card-bg); border-radius: 18px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.05); position: relative; }
        .media-card-img-wrapper { width: 100%; height: 220px; background: #1a202c; display: flex; align-items: center; justify-content: center; }
        .media-card-img { width: 100%; height: 100%; object-fit: cover; }
        .media-card-content { padding: 18px; }
        .media-card-title { font-size: 16px; margin: 0 0 10px 0; color: #fff; }
        .media-card-desc { font-size: 13px; color: #a0aec0; margin: 0 0 10px 0; }
        .media-card-footer { color: #a0aec0; font-size: 12px; text-align: left; }

        .admin-panel-card { background: rgba(15, 23, 42, 0.95); border: 2px dashed #f59e0b; border-radius: 20px; padding: 25px; margin-top: 25px; }
        .admin-input { width: 100%; padding: 12px; margin: 6px 0 12px 0; border-radius: 8px; border: 1px solid rgba(246, 173, 85, 0.3); background: #020617; color: #fff; }
        .admin-btn { background: #10b981; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }

        .admin-controls-overlay { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; }
        .action-btn { cursor: pointer; font-size: 12px; color: #fff; background: rgba(0,0,0,0.75); padding: 6px 10px; border-radius: 6px; }

        footer { text-align: center; padding: 20px; background: var(--footer-bg); border-top: 1px solid var(--footer-border); color: var(--footer-text); margin-top: 40px; }
    </style>
</head>
<body>

    <div class="top-buttons-container">
        <button class="toggle-btn" onclick="document.getElementById('mySidebar').style.width = '260px';"><i class="fa-solid fa-bars"></i> القائمة</button>
    </div>

    <div class="sidebar" id="mySidebar">
        <div class="sidebar-title">👁️ منصة رؤيا</div>
        <a href="index.html" class="menu-item"><i class="fa-solid fa-house"></i> الرئيسية</a>
        <a href="classes.html" class="menu-item"><i class="fa-solid fa-school"></i> إدارة الصفوف</a>
        <button onclick="localStorage.removeItem('currentUser'); window.location.href='login.html';" class="logout-btn">تسجيل الخروج</button>
    </div>

    <div class="main-content">
        <div class="dashboard-container">
            <h2><i class="fa-solid fa-newspaper" style="color: #f6ad55;"></i> الأخبار والتبليغات M2026</h2>
            
            <div class="news-header-bar">
                <input type="text" id="searchInput" class="search-input" placeholder="ابحث في الأخبار..." oninput="handleSearch()">
            </div>

            <div class="news-grid-container" id="unifiedNewsContainer">
                <div style="color: #a0aec0;">جاري الاتصال بالسحاب وتنزيل الأخبار...</div>
            </div>

            <!-- لوحة التحكم -->
            <div id="adminPanel" class="admin-panel-card">
                <h3><i class="fa-solid fa-user-shield"></i> لوحة النشر السحابي المباشر</h3>
                <input type="hidden" id="editDocId">
                <input type="text" id="postTitleInput" placeholder="عنوان الخبر..." class="admin-input">
                <textarea id="postDescInput" placeholder="تفاصيل الخبر..." class="admin-input" rows="3"></textarea>
                <input type="text" id="postDateInput" placeholder="التاريخ" class="admin-input">
                <label style="color: #f59e0b; font-size: 13px;">اختيار الصورة من الجهاز:</label>
                <input type="file" id="postImageFileInput" accept="image/*" class="admin-input">
                <button onclick="savePostToFirebase()" class="admin-btn" id="savePostBtn"><i class="fa-solid fa-cloud-arrow-up"></i> حفظ ونشر سحابي ثابت</button>
            </div>
        </div>
    </div>

    <footer>جميع الحقوق محفوظة © منصة رؤيا التعليمية</footer>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAuWDpBoR31ZjPzaUrAe4lppufSHuMLFyI",
            authDomain: "roya-platform-26860.firebaseapp.com",
            projectId: "roya-platform-26860",
            storageBucket: "roya-platform-26860.firebasestorage.app",
            messagingSenderId: "897544406776",
            appId: "1:897544406776:web:aa112013dea672fb141d0d"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allPosts = [];

        // الاستماع المباشر للتغييرات
        db.collection("posts").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
            allPosts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderPosts(allPosts);
        }, (error) => {
            console.error("Firestore Error:", error);
            alert("خطأ في الاتصال بقاعدة البيانات! يرجى التحقق من قواعد الحماية Rules في Firebase.");
        });

        function renderPosts(posts) {
            const container = document.getElementById('unifiedNewsContainer');
            if (posts.length === 0) {
                container.innerHTML = `<div style="color: #a0aec0; grid-column: 1/-1;">لا توجد أخبار محفوظة في قاعدة البيانات حالياً.</div>`;
                return;
            }

            container.innerHTML = posts.map(item => `
                <div class="media-card">
                    <div class="admin-controls-overlay">
                        <span class="action-btn" onclick="deletePost('${item.id}')"><i class="fa-solid fa-trash" style="color:#f87171;"></i></span>
                    </div>
                    <div class="media-card-img-wrapper">
                        ${item.image ? `<img src="${item.image}" class="media-card-img">` : `<span style="color:#64748b;">بدون صورة</span>`}
                    </div>
                    <div class="media-card-content">
                        <h3 class="media-card-title">${item.title}</h3>
                        <p class="media-card-desc">${item.desc || ''}</p>
                        <div class="media-card-footer">${item.date || ''}</div>
                    </div>
                </div>
            `).join('');
        }

        // دالة ضغط وتصغير الصورة فائقة السرعة
        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 600; // تحديد عرض مناسب للشبكة
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        // ضغط الجودة لـ 50%
                        resolve(canvas.toDataURL('image/jpeg', 0.5));
                    };
                };
            });
        }

        async function savePostToFirebase() {
            const btn = document.getElementById('savePostBtn');
            const title = document.getElementById('postTitleInput').value.trim();
            const desc = document.getElementById('postDescInput').value.trim();
            let date = document.getElementById('postDateInput').value.trim();
            const fileInput = document.getElementById('postImageFileInput');

            if (!title) return alert("يرجى كتابة عنوان الخبر");

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> جاري الحفظ السحابي...`;

            if (!date) {
                const today = new Date();
                date = `${today.getFullYear()}/${today.getMonth()+1}/${today.getDate()}`;
            }

            let imageBase64 = "";
            if (fileInput.files && fileInput.files[0]) {
                imageBase64 = await compressImage(fileInput.files[0]);
            }

            db.collection("posts").add({
                title: title,
                desc: desc,
                date: date,
                image: imageBase64,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("✅ تم حفظ الخبر في قاعدة البيانات بنجاح! ولن يختفي عند التحديث.");
                document.getElementById('postTitleInput').value = '';
                document.getElementById('postDescInput').value = '';
                document.getElementById('postDateInput').value = '';
                fileInput.value = '';
            }).catch((err) => {
                alert("❌ حدث خطأ أثناء الحفظ! تأكد من تغيير Rules إلى allow write: if true; في Firebase. التفاصيل: " + err.message);
            }).finally(() => {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> حفظ ونشر سحابي ثابت`;
            });
        }

        function deletePost(id) {
            if (confirm("هل أنت متأكد من الحذف النهائي من السحاب؟")) {
                db.collection("posts").doc(id).delete();
            }
        }

        function handleSearch() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allPosts.filter(p => p.title.toLowerCase().includes(q) || (p.desc && p.desc.toLowerCase().includes(q)));
            renderPosts(filtered);
        }
    </script>
</body>
</html>
