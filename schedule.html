<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="icona99.png">
<link rel="apple-touch-icon" href="icona99.png">
<title>الجدول الدراسي - منصة الوادي</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background-color: #020617; color: #ffffff; box-sizing: border-box; }
*, *:before, *:after { box-sizing: inherit; }
.sidebar { height: 100vh; width: 0; position: fixed; top: 0; right: 0; background: linear-gradient(180deg, #0f172a, #020617); box-shadow: 0 4px 30px rgba(0,0,0,0.8); transition: width 0.4s; overflow-x: hidden; z-index: 1000; display: flex; flex-direction: column; padding: 20px 0; border-left: 1px solid rgba(246, 173, 85, 0.3); }
.sidebar-title { color: #f6ad55; font-size: 21px; font-weight: bold; padding-bottom: 20px; border-bottom: 2px solid rgba(246, 173, 85, 0.3); margin-bottom: 15px; text-align: center; white-space: nowrap; text-shadow: 0 2px 10px rgba(246, 173, 85, 0.2); }
.menu-item { color: #e2e8f0; background: rgba(246, 173, 85, 0.03); border: 1px solid rgba(246, 173, 85, 0.1); border-radius: 12px; margin: 8px 15px; padding: 12px 18px; text-align: center; transition: 0.3s; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; white-space: nowrap; font-weight: 500; text-decoration: none; }
.menu-item i { color: #f6ad55; }
.menu-item:hover { background: rgba(246, 173, 85, 0.15); color: #f6ad55; border-color: rgba(246, 173, 85, 0.5); transform: translateY(-2px); box-shadow: 0 4px 15px rgba(246, 173, 85, 0.15); }
.logout-btn { margin-top: auto; padding: 12px; background: rgba(229, 62, 62, 0.1); color: #fca5a5; border: 1px solid rgba(229, 62, 62, 0.3); border-radius: 12px; cursor: pointer; transition: 0.3s; font-weight: bold; width: 80%; margin: 20px auto; }
.logout-btn:hover { background: #e53e3e; color: white; }
.toggle-btn { position: fixed; top: 20px; right: 20px; z-index: 1002; padding: 12px 20px; cursor: pointer; background: #0f172a; color: #f6ad55; border: 1px solid rgba(246, 173, 85, 0.3); border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-weight: bold; font-size: 14px; }
.main-content { margin-right: 0; padding: 20px; transition: 0.4s; max-width: 1300px; margin: 0 auto; width: 100%; }
.page-header { background: linear-gradient(135deg, #0f172a, #1e293b); color: #f6ad55; border: 1px solid rgba(246, 173, 85, 0.2); padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; }
.page-header h1 { margin: 0 0 8px 0; font-size: 24px; }
.page-header p { margin: 0; opacity: 0.95; font-size: 14px; color: #a0aec0; }
.controls-bar { background: #0f172a; padding: 15px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 1px solid rgba(246, 173, 85, 0.15); margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.control-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; width: 100%; }
.control-group label { font-weight: bold; font-size: 14px; color: #f6ad55; }
.control-group select, .control-group button, .control-group a { padding: 8px 12px; border: 1px solid rgba(246, 173, 85, 0.3); border-radius: 8px; font-size: 14px; outline: none; background: #020617; color: #fff; }
.control-group select { cursor: pointer; }
.print-btn { background: #d97706; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
.print-btn:hover { background: #b45309; }
.home-btn { background: #334155; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-flex; align-items: center; }
.home-btn:hover { background: #475569; }
.admin-controls { display: none; background: #0f172a; border: 2px dashed rgba(246, 173, 85, 0.4); padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
.admin-controls button { background: #d97706; color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; margin: 5px; transition: 0.2s; }
.admin-controls button:hover { background: #b45309; }
.schedule-table-container { background: #0f172a; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); overflow-x: auto; border: 1px solid rgba(246, 173, 85, 0.15); margin-bottom: 20px; }
table { width: 100%; border-collapse: collapse; text-align: center; min-width: 650px; }
th, td { border: 1px solid rgba(246, 173, 85, 0.15); padding: 10px; font-size: 13px; vertical-align: middle; }
th { background: #1e293b; color: #f6ad55; font-weight: bold; }
tr:nth-child(even) { background: rgba(2, 6, 23, 0.3); }
.cell-content { display: flex; flex-direction: column; gap: 6px; min-width: 120px; }
.cell-select, .cell-input { width: 100%; padding: 6px; border: 1px solid rgba(246, 173, 85, 0.2); border-radius: 6px; font-size: 12px; background: #020617; color: #fff; box-sizing: border-box; }
.cell-view-subject { font-weight: bold; color: #f6ad55; font-size: 14px; }
.cell-view-teacher { font-size: 12px; color: #a0aec0; background: #1e293b; padding: 3px 6px; border-radius: 4px; display: inline-block; border: 1px solid rgba(246, 173, 85, 0.1); }
.save-schedule-btn { background: #d97706; color: white; border: none; padding: 12px 30px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; display: none; margin: 20px auto; box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3); transition: 0.2s; }
.save-schedule-btn:hover { background: #b45309; }

@media(min-width: 768px) {
    .main-content { padding: 30px; }
    .control-group { width: auto; }
    th, td { padding: 12px; font-size: 14px; }
}

@media print {
    body { background: white; color: #000; }
    .sidebar, .toggle-btn, .admin-controls, .controls-bar, .save-schedule-btn, .cell-select, .cell-input { display: none !important; }
    .main-content { margin: 0; padding: 0; max-width: 100%; }
    .schedule-table-container { box-shadow: none; border: 1px solid #000; overflow: visible; background: white !important; }
    th { background: #eee !important; color: #000 !important; -webkit-print-color-adjust: exact; }
    td { border: 1px solid #000 !important; color: #000 !important; }
    .cell-view-subject { color: #000 !important; }
    .cell-view-teacher { background: #eee !important; color: #000 !important; border: none !important; }
}
</style>
</head>
<body>

<button class="toggle-btn" onclick="document.getElementById('mySidebar').style.width = '260px'; document.getElementById('sidebarOverlay').style.display = 'block';">
    <i class="fa-solid fa-bars"></i> القائمة
</button>

<div class="sidebar" id="mySidebar">
    <div class="sidebar-title">🏞️ منصة الوادي</div>
    <a href="index.html" class="menu-item"><i class="fa-solid fa-house"></i> الرئيسية</a>
    <a href="classes.html" class="menu-item"><i class="fa-solid fa-school"></i> إدارة الصفوف والدردشة</a>
    <a href="schedule.html" class="menu-item"><i class="fa-solid fa-clock"></i> الحصص والجداول</a>
    <a href="games.html" class="menu-item"><i class="fa-solid fa-gamepad"></i> الألعاب والترفيه</a>
    <a href="library.html" class="menu-item"><i class="fa-solid fa-book"></i> المكتبة الرقمية</a>
    <button onclick="localStorage.removeItem('currentUser'); window.location.href='login.html';" class="logout-btn">تسجيل الخروج</button>
</div>

<div onclick="document.getElementById('mySidebar').style.width = '0'; document.getElementById('sidebarOverlay').style.display = 'none';" style="position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:999; display:none;" id="sidebarOverlay"></div>

<div class="main-content">
    <div class="page-header">
        <h1>⏰ الجدول الدراسي الأسبوعي</h1>
        <p>عرض وتنظيم الحصص الدراسية اليومية حسب الصف والشعبة (من الأحد إلى الخميس)</p>
    </div>

    <div class="admin-controls" id="adminControlsPanel">
        <h4 style="margin: 0 0 10px 0; color: #f6ad55;">⚙️ لوحة تحكم المدير (تعديل هيكل الجدول)</h4>
        <button onclick="window.addGrade()">+ إضافة صف دراسي</button>
        <button onclick="window.removeGrade()">- حذف صف دراسي</button>
        <button onclick="window.addSection()">+ إضافة شعبة</button>
        <button onclick="window.removeSection()">- حذف شعبة</button>
        <button onclick="window.addPeriod()">+ إضافة حصة دراسية</button>
        <button onclick="window.removePeriod()">- حذف حصة دراسية</button>
    </div>

    <div class="controls-bar">
        <div class="control-group">
            <label>اختر الصف:</label>
            <select id="filterGrade" onchange="renderScheduleTable()"></select>
            <label>اختر الشعبة:</label>
            <select id="filterSection" onchange="renderScheduleTable()"></select>
        </div>
        <div class="control-group">
            <a href="index.html" class="home-btn"><i class="fa-solid fa-house"></i> العودة للرئيسية</a>
            <button onclick="window.print()" class="print-btn"><i class="fa-solid fa-print"></i> طباعة الجدول (PDF)</button>
        </div>
    </div>

    <div class="schedule-table-container">
        <table>
            <thead>
                <tr id="tableHeaderRow"></tr>
            </thead>
            <tbody id="scheduleTableBody"></tbody>
        </table>
    </div>

    <button onclick="window.saveScheduleData()" class="save-schedule-btn" id="saveScheduleBtn">حفظ تعديلات الجدول 💾</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyAuWDpBoR31ZjPzaUrAe4lppufSHuMLFyI",
    databaseURL: "https://roya-platform-26860-default-rtdb.firebaseio.com",
    projectId: "roya-platform-26860",
    storageBucket: "roya-platform-26860.appspot.com",
    messagingSenderId: "897544406776",
    appId: "1:897544406776:web:aa112013dea672fb141d0d"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
window.database = firebase.database();

let isManager = false;
let isTeacher = false;
const daysOfWeek = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
let gradesList = ['الصف الأول', 'الصف الثاني', 'الصف الثالث', 'الصف الرابع', 'الصف الخامس', 'الصف السادس'];
let sectionsList = ['الشعبة أ', 'الشعبة ب', 'الشعبة ج'];
let totalPeriods = 4;

const subjectsOptions = [
    'اختر المادة',
    'اللغة العربية',
    'الرياضيات',
    'العلوم',
    'التربية الإسلامية',
    'اللغة الإنجليزية',
    'الاجتماعيات',
    'التربية الفنية',
    'الرياضة والبدنية'
];

let remoteScheduleData = {};

document.addEventListener('DOMContentLoaded', () => {
    try {
        const currentUser = JSON.parse(localStorage.getItem("currentUser"));
        if (!currentUser) {
            window.location.href = 'login.html';
            return;
        }
        const secretCode = currentUser.code ? currentUser.code.trim() : "";
        const registeredRole = currentUser.role ? currentUser.role.trim().toLowerCase() : "";
        if (secretCode === 'ahmed2026' || registeredRole === 'admin' || registeredRole === 'المدير') {
            isManager = true;
            document.getElementById('adminControlsPanel').style.display = 'block';
            document.getElementById('saveScheduleBtn').style.display = 'block';
        } else if (registeredRole === 'teacher' || registeredRole === 'الأستاذ') {
            isTeacher = true;
        }
    } catch(e) {
        window.location.href = 'login.html';
        return;
    }
    
    buildDropdowns();
    fetchScheduleData();
});

function buildDropdowns() {
    const gSelect = document.getElementById('filterGrade');
    const sSelect = document.getElementById('filterSection');
    
    const currentG = gSelect.value;
    const currentS = sSelect.value;

    gSelect.innerHTML = "";
    gradesList.forEach(g => {
        gSelect.innerHTML += `<option value="${g}">${g}</option>`;
    });
    if(gradesList.includes(currentG)) gSelect.value = currentG;

    sSelect.innerHTML = "";
    sectionsList.forEach(s => {
        sSelect.innerHTML += `<option value="${s}">${s}</option>`;
    });
    if(sectionsList.includes(currentS)) sSelect.value = currentS;
}

function fetchScheduleData() {
    window.database.ref('schedule/').on('value', snap => {
        remoteScheduleData = snap.val() || {};
        renderScheduleTable();
    });
}

window.renderScheduleTable = function() {
    const grade = document.getElementById('filterGrade').value;
    const section = document.getElementById('filterSection').value;
    const tbody = document.getElementById('scheduleTableBody');
    const theadTr = document.getElementById('tableHeaderRow');
    
    tbody.innerHTML = "";

    // بناء الهيدر
    let headersHTML = `<th>اليوم / الحصة</th>`;
    for(let p = 1; p <= totalPeriods; p++) {
        headersHTML += `<th>الحصة ${p}</th>`;
    }
    theadTr.innerHTML = headersHTML;

    // بناء جدول الأيام
    daysOfWeek.forEach((day, dIndex) => {
        const tr = document.createElement('tr');
        let tdHTML = `<td style="font-weight: bold; background: #0f172a; color: #f6ad55;">${day}</td>`;
        
        for(let p = 1; p <= totalPeriods; p++) {
            const savedCell = (remoteScheduleData[grade] && remoteScheduleData[grade][section] && remoteScheduleData[grade][section][`day${dIndex}_p${p}`]) || { subject: '', teacher: '' };
            
            if (isManager) {
                let optionsHTML = "";
                subjectsOptions.forEach(sub => {
                    const optionVal = sub === 'اختر المادة' ? '' : sub;
                    const sel = savedCell.subject === optionVal ? 'selected' : '';
                    optionsHTML += `<option value="${optionVal}" ${sel}>${sub}</option>`;
                });
                
                tdHTML += `
                    <td>
                        <div class="cell-content">
                            <select class="cell-select" data-day="${dIndex}" data-period="${p}">
                                ${optionsHTML}
                            </select>
                            <input type="text" class="cell-input" data-day="${dIndex}" data-period="${p}" value="${savedCell.teacher || ''}" placeholder="اسم الأستاذ...">
                        </div>
                    </td>
                `;
            } else if (isTeacher) {
                tdHTML += `
                    <td>
                        <div class="cell-content">
                            <span class="cell-view-subject">${savedCell.subject || '-'}</span>
                            <span class="cell-view-teacher">👨‍🏫 ${savedCell.teacher || 'غير محدد'}</span>
                        </div>
                    </td>
                `;
            } else {
                tdHTML += `
                    <td>
                        <div class="cell-content">
                            <span class="cell-view-subject">${savedCell.subject || '-'}</span>
                        </div>
                    </td>
                `;
            }
        }
        tr.innerHTML = tdHTML;
        tbody.appendChild(tr);
    });
};

window.saveScheduleData = function() {
    if (!isManager) return;
    const grade = document.getElementById('filterGrade').value;
    const section = document.getElementById('filterSection').value;
    const selects = document.querySelectorAll('.cell-select');
    const inputs = document.querySelectorAll('.cell-input');
    
    let sectionData = {};

    selects.forEach((sel, idx) => {
        const day = sel.getAttribute('data-day');
        const period = sel.getAttribute('data-period');
        const key = `day${day}_p${period}`;
        
        sectionData[key] = {
            subject: sel.value,
            teacher: inputs[idx].value.trim()
        };
    });

    window.database.ref('schedule/' + grade + '/' + section).set(sectionData).then(() => {
        alert("تم حفظ الجدول الدراسي بنجاح!");
    }).catch(err => {
        alert("فشل الحفظ: " + err.message);
    });
};

window.addGrade = function() {
    const newG = prompt("أدخل اسم الصف الدراسي الجديد:");
    if(newG && newG.trim() !== "") {
        const formattedName = newG.trim();
        if(!gradesList.includes(formattedName)) {
            gradesList.push(formattedName);
            buildDropdowns();
            renderScheduleTable();
            alert("تمت إضافة الصف بنجاح.");
        }
    }
};

window.removeGrade = function() {
    if(gradesList.length <= 1) return alert("يجب أن يبقى صف واحد على الأقل.");
    const g = document.getElementById('filterGrade').value;
    if(confirm(`هل أنت تأكد من حذف ${g}؟`)) {
        gradesList = gradesList.filter(item => item !== g);
        buildDropdowns();
        renderScheduleTable();
        alert("تم حذف الصف.");
    }
};

window.addSection = function() {
    const newS = prompt("أدخل اسم الشعبة الجديدة:");
    if(newS && newS.trim() !== "") {
        const formattedSection = newS.trim();
        if(!sectionsList.includes(formattedSection)) {
            sectionsList.push(formattedSection);
            buildDropdowns();
            renderScheduleTable();
            alert("تمت إضافة الشعبة بنجاح.");
        }
    }
};

window.removeSection = function() {
    if(sectionsList.length <= 1) return alert("يجب أن تبقى شعبة واحدة على الأقل.");
    const s = document.getElementById('filterSection').value;
    if(confirm(`هل أنت تأكد من حذف ${s}؟`)) {
        sectionsList = sectionsList.filter(item => item !== s);
        buildDropdowns();
        renderScheduleTable();
        alert("تم حذف الشعبة.");
    }
};

window.addPeriod = function() {
    totalPeriods++;
    renderScheduleTable();
};

window.removePeriod = function() {
    if(totalPeriods <= 1) return alert("يجب أن تبقى حصة واحدة على الأقل.");
    totalPeriods--;
    renderScheduleTable();
};
</script>
</body>
</html>
