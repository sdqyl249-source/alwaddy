<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="icona99.png">
    <link rel="apple-touch-icon" href="icona99.png">
    <title>المكتبة الرقمية - كتب المرحلة الابتدائية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f1f5f9; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* القائمة الجانبية */
        .sidebar { height: 100vh; width: 0; position: fixed; top: 0; right: 0; background: #ffffff; box-shadow: -4px 0 25px rgba(0,0,0,0.08); transition: width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); overflow-x: hidden; z-index: 1000; display: flex; flex-direction: column; padding: 20px 0; border-left: 1px solid #e2e8f0; }
        .sidebar-title { color: #0284c7; font-size: 21px; font-weight: bold; padding-bottom: 20px; border-bottom: 2px solid #f1f5f9; margin-bottom: 15px; text-align: center; white-space: nowrap; }
        .menu-item { color: #334155; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; margin: 8px 15px; padding: 12px 18px; text-align: center; transition: 0.3s; cursor: pointer; display: flex; align-items: center; justify-content: flex-start; gap: 12px; white-space: nowrap; font-weight: 600; text-decoration: none; }
        .menu-item i { color: #0284c7; font-size: 18px; }
        .menu-item:hover { background: #e0f2fe; color: #0369a1; border-color: #38bdf8; }
        .logout-btn { margin-top: auto; padding: 12px; background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; border-radius: 12px; cursor: pointer; transition: 0.3s; font-weight: bold; width: 85%; margin: 20px auto; }
        .logout-btn:hover { background: #dc2626; color: white; }
        .toggle-btn { position: fixed; top: 20px; right: 20px; z-index: 999; padding: 10px 18px; cursor: pointer; background: #ffffff; color: #0284c7; border: 1px solid #cbd5e1; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); font-weight: bold; display: flex; align-items: center; gap: 8px; font-size: 14px; }
        
        .main-content { margin-right: 0; padding: 15px; transition: 0.4s; max-width: 1000px; margin: 0 auto; width: 100%; flex: 1; }
        @media (min-width: 768px) { .main-content { padding: 30px; } }
        
        .page-header { background: linear-gradient(135deg, #0284c7, #0369a1); color: #ffffff; padding: 25px 20px; border-radius: 18px; margin-bottom: 20px; text-align: center; box-shadow: 0 8px 20px rgba(2, 132, 199, 0.15); }
        .page-header h1 { margin: 0 0 8px 0; font-size: 24px; font-weight: 800; }
        .page-header p { margin: 0; opacity: 0.9; font-size: 14px; }
        
        /* قسم الفلاتر والبحث */
        .filter-section { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 15px; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .search-box { position: relative; margin-bottom: 12px; }
        .search-box input { width: 100%; background: #f8fafc; border: 1px solid #cbd5e1; padding: 12px 42px 12px 15px; border-radius: 10px; color: #1e293b; font-size: 14px; outline: none; transition: 0.3s; }
        .search-box input:focus { border-color: #0284c7; background: #ffffff; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1); }
        .search-box i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 16px; }
        
        .class-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .class-tabs::-webkit-scrollbar { display: none; }
        .tab-btn { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; transition: 0.2s; font-size: 13px; }
        .tab-btn:hover, .tab-btn.active { background: #0284c7; color: #ffffff; border-color: #0284c7; box-shadow: 0 3px 10px rgba(2, 132, 199, 0.2); }
        
        /* تقسيمات الصفوف والكتب الأفقية */
        .grade-section { margin-bottom: 30px; }
        .grade-title { font-size: 18px; font-weight: 800; color: #0369a1; margin: 0 0 15px 0; padding-bottom: 8px; border-bottom: 2px solid #e2e8f0; display: flex; align-items: center; gap: 8px; }
        .books-list { display: flex; flex-direction: column; gap: 12px; }
        
        /* البطاقة الأفقية الحديثة */
        .book-card-horizontal { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 12px 16px; display: flex; align-items: center; gap: 16px; transition: all 0.25s ease; position: relative; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .book-card-horizontal:hover { transform: translateY(-2px); border-color: #38bdf8; box-shadow: 0 6px 16px rgba(2, 132, 199, 0.08); }
        
        .book-icon-wrapper { width: 50px; height: 50px; min-width: 50px; background: #e0f2fe; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #0284c7; font-size: 22px; }
        .book-info { flex: 1; min-width: 0; }
        .book-title { font-size: 15px; font-weight: 700; color: #0f172a; margin: 0 0 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .book-meta { display: flex; align-items: center; gap: 12px; font-size: 12px; color: #64748b; flex-wrap: wrap; }
        .book-meta span { display: flex; align-items: center; gap: 4px; }
        
        .book-actions-horizontal { display: flex; align-items: center; gap: 8px; }
        .btn-action { text-decoration: none; border: none; border-radius: 8px; padding: 8px 12px; font-size: 12px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; white-space: nowrap; }
        .btn-dl { background: #0284c7; color: #ffffff; }
        .btn-dl:hover { background: #0369a1; }
        .btn-pv { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
        .btn-pv:hover { background: #e2e8f0; }
        .btn-del { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .btn-del:hover { background: #dc2626; color: #ffffff; }

        @media (max-width: 600px) {
            .book-card-horizontal { flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px; }
            .book-icon-wrapper { width: 42px; height: 42px; min-width: 42px; font-size: 18px; }
            .book-actions-horizontal { width: 100%; border-top: 1px solid #f1f5f9; padding-top: 10px; justify-content: flex-end; }
            .btn-action { flex: 1; justify-content: center; }
        }

        /* الزر العائم لإضافة كتاب (للمعلم والمدير فقط) */
        .fab-btn { position: fixed; bottom: 25px; left: 25px; z-index: 998; background: #16a34a; color: white; border: none; border-radius: 50px; padding: 14px 22px; font-weight: bold; font-size: 14px; display: none; align-items: center; gap: 8px; box-shadow: 0 8px 20px rgba(22, 163, 74, 0.3); cursor: pointer; transition: 0.3s; }
        .fab-btn:hover { background: #15803d; transform: scale(1.05); }

        /* النافذة المنبثقة (Modal) */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 1050; display: none; align-items: center; justify-content: center; padding: 15px; }
        .modal-card { background: #ffffff; border-radius: 20px; width: 100%; max-width: 480px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); animation: modalIn 0.3s ease; position: relative; }
        @keyframes modalIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #e2e8f0; }
        .modal-header h3 { margin: 0; font-size: 18px; color: #0369a1; display: flex; align-items: center; gap: 8px; }
        .close-modal { background: none; border: none; font-size: 20px; color: #64748b; cursor: pointer; transition: 0.2s; }
        .close-modal:hover { color: #dc2626; }

        .modal-form { display: flex; flex-direction: column; gap: 12px; }
        .modal-form label { font-size: 12px; font-weight: bold; color: #475569; margin-bottom: -6px; }
        .modal-form input, .modal-form select { padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; background: #f8fafc; }
        .modal-form input:focus, .modal-form select:focus { border-color: #0284c7; background: #fff; }
        .modal-form button { background: #16a34a; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 10px; transition: 0.2s; }
        .modal-form button:hover { background: #15803d; }

        footer { text-align: center; padding: 20px; background: #ffffff; border-top: 1px solid #e2e8f0; color: #64748b; font-size: 13px; margin-top: auto; }
    </style>
</head>
<body>

    <button class="toggle-btn" onclick="document.getElementById('mySidebar').style.width = '260px'; document.getElementById('sidebarOverlay').style.display = 'block';">
        <i class="fa-solid fa-bars"></i> القائمة
    </button>

    <div class="sidebar" id="mySidebar">
        <div class="sidebar-title">🏞️ منصة الوادي</div>
        <a href="index.html" class="menu-item"><i class="fa-solid fa-house"></i> الرئيسية</a>
        <a href="classes.html" class="menu-item"><i class="fa-solid fa-school"></i> إدارة الصفوف</a>
        <a href="schedule.html" class="menu-item"><i class="fa-solid fa-clock"></i> الجداول</a>
        <a href="games.html" class="menu-item"><i class="fa-solid fa-gamepad"></i> الألعاب والترفيه</a>
        <a href="library.html" class="menu-item"><i class="fa-solid fa-book"></i> المكتبة الرقمية</a>
        <button onclick="localStorage.removeItem('currentUser'); localStorage.removeItem('userRole'); window.location.href='login.html';" class="logout-btn">تسجيل الخروج</button>
    </div>
    
    <div onclick="document.getElementById('mySidebar').style.width = '0'; document.getElementById('sidebarOverlay').style.display = 'none';" style="position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:999; display:none;" id="sidebarOverlay"></div>

    <div class="main-content">
        <div class="page-header">
            <h1>📚 كتب المرحلة الابتدائية الشاملة</h1>
            <p>منصة رقمية سريعة ومريحة للاستعراض والتحميل المباشر</p>
        </div>

        <div class="filter-section">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" onkeyup="filterBooks()" placeholder="ابحث باسم الكتاب أو المادة...">
            </div>
            
            <div class="class-tabs">
                <button class="tab-btn active" onclick="selectGrade('all', this)">كل الصفوف</button>
                <button class="tab-btn" onclick="selectGrade('الصف الأول الابتدائي', this)">الأول</button>
                <button class="tab-btn" onclick="selectGrade('الصف الثاني الابتدائي', this)">الثاني</button>
                <button class="tab-btn" onclick="selectGrade('الصف الثالث الابتدائي', this)">الثالث</button>
                <button class="tab-btn" onclick="selectGrade('الصف الرابع الابتدائي', this)">الرابع</button>
                <button class="tab-btn" onclick="selectGrade('الصف الخامس الابتدائي', this)">الخامس</button>
                <button class="tab-btn" onclick="selectGrade('الصف السادس الابتدائي', this)">السادس</button>
            </div>
        </div>

        <div id="sectionsContainer"></div>
    </div>

    <!-- زر إضافة كتاب العائم (يظهر فقط للمعلم والمدير) -->
    <button class="fab-btn" id="fabAddBook" onclick="openModal()">
        <i class="fa-solid fa-plus"></i> إضافة كتاب جديد
    </button>

    <!-- النافذة المنبثقة لإضافة الكتاب -->
    <div class="modal-overlay" id="addBookModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-book-medical"></i> إضافة كتاب جديد للمكتبة</h3>
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form class="modal-form" onsubmit="addNewBook(event)">
                <label>اسم الكتاب / المادة:</label>
                <input type="text" id="newBookTitle" placeholder="مثال: الرياضيات" required>
                
                <label>الجهة الناشرة / المؤلف:</label>
                <input type="text" id="newBookAuthor" value="وزارة التربية" required>
                
                <label>الصف الدراسي:</label>
                <select id="newBookGrade" required>
                    <option value="الصف الأول الابتدائي">الصف الأول الابتدائي</option>
                    <option value="الصف الثاني الابتدائي">الصف الثاني الابتدائي</option>
                    <option value="الصف الثالث الابتدائي">الصف الثالث الابتدائي</option>
                    <option value="الصف الرابع الابتدائي">الصف الرابع الابتدائي</option>
                    <option value="الصف الخامس الابتدائي">الصف الخامس الابتدائي</option>
                    <option value="الصف السادس الابتدائي">الصف السادس الابتدائي</option>
                </select>
                
                <label>حجم الملف:</label>
                <input type="text" id="newBookSize" placeholder="مثال: 8.5 MB" value="10.0 MB" required>
                
                <label>رابط الكتاب / الملف (PDF):</label>
                <input type="text" id="newBookUrl" placeholder="books/filename.pdf" value="books/sample.pdf" required>
                
                <button type="submit"><i class="fa-solid fa-check"></i> حفظ ونشر الكتاب</button>
            </form>
        </div>
    </div>

    <footer>جميع الحقوق محفوظة © منصة الوادي التعليمية 2026</footer>

    <script src="scriot.js"></script>
    <script>
        const initialPrimaryData = [
          { gradeName: "الصف الأول الابتدائي", books: [
            { id: 101, title: "قراءتي - الصف الأول", author: "وزارة التربية", size: "6.5 MB", type: "PDF", coverIcon: "fa-child-reaching", fileUrl: "books/primary1_arabic.pdf" },
            { id: 102, title: "الرياضيات - الصف الأول", author: "وزارة التربية", size: "7.2 MB", type: "PDF", coverIcon: "fa-shapes", fileUrl: "books/primary1_math.pdf" },
            { id: 103, title: "العلوم - الصف الأول", author: "وزارة التربية", size: "8.0 MB", type: "PDF", coverIcon: "fa-seedling", fileUrl: "books/primary1_science.pdf" },
            { id: 104, title: "التربية الإسلامية - الأول", author: "وزارة التربية", size: "5.5 MB", type: "PDF", coverIcon: "fa-kaaba", fileUrl: "books/primary1_islamic.pdf" }
          ]},
          { gradeName: "الصف الثاني الابتدائي", books: [
            { id: 201, title: "قراءتي - الصف الثاني", author: "وزارة التربية", size: "7.8 MB", type: "PDF", coverIcon: "fa-book-open-reader", fileUrl: "books/primary2_arabic.pdf" },
            { id: 202, title: "الرياضيات - الصف الثاني", author: "وزارة التربية", size: "8.5 MB", type: "PDF", coverIcon: "fa-calculator", fileUrl: "books/primary2_math.pdf" },
            { id: 203, title: "العلوم - الصف الثاني", author: "وزارة التربية", size: "8.9 MB", type: "PDF", coverIcon: "fa-flask", fileUrl: "books/primary2_science.pdf" }
          ]},
          { gradeName: "الصف الثالث الابتدائي", books: [
            { id: 301, title: "القراءة العربية - الثالث", author: "وزارة التربية", size: "9.1 MB", type: "PDF", coverIcon: "fa-book", fileUrl: "books/primary3_arabic.pdf" },
            { id: 302, title: "الرياضيات - الصف الثالث", author: "وزارة التربية", size: "9.8 MB", type: "PDF", coverIcon: "fa-arrow-up-right-dots", fileUrl: "books/primary3_math.pdf" },
            { id: 303, title: "العلوم - الصف الثالث", author: "وزارة التربية", size: "10.4 MB", type: "PDF", coverIcon: "fa-atom", fileUrl: "books/primary3_science.pdf" },
            { id: 304, title: "اللغة الإنجليزية - الثالث", author: "وزارة التربية", size: "11.0 MB", type: "PDF", coverIcon: "fa-language", fileUrl: "books/primary3_english.pdf" }
          ]},
          { gradeName: "الصف الرابع الابتدائي", books: [
            { id: 401, title: "قواعد اللغة العربية - الرابع", author: "وزارة التربية", size: "11.2 MB", type: "PDF", coverIcon: "fa-pen-nib", fileUrl: "books/primary4_arabic.pdf" },
            { id: 402, title: "الرياضيات - الصف الرابع", author: "وزارة التربية", size: "12.0 MB", type: "PDF", coverIcon: "fa-square-root-variable", fileUrl: "books/primary4_math.pdf" },
            { id: 403, title: "العلوم - الصف الرابع", author: "وزارة التربية", size: "11.5 MB", type: "PDF", coverIcon: "fa-microscope", fileUrl: "books/primary4_science.pdf" },
            { id: 404, title: "الاجتماعيات - الصف الرابع", author: "وزارة التربية", size: "10.0 MB", type: "PDF", coverIcon: "fa-earth-americas", fileUrl: "books/primary4_social.pdf" }
          ]},
          { gradeName: "الصف الخامس الابتدائي", books: [
            { id: 501, title: "اللغة العربية - الصف الخامس", author: "وزارة التربية", size: "12.5 MB", type: "PDF", coverIcon: "fa-feather", fileUrl: "books/primary5_arabic.pdf" },
            { id: 502, title: "الرياضيات - الصف الخامس", author: "وزارة التربية", size: "13.8 MB", type: "PDF", coverIcon: "fa-chart-pie", fileUrl: "books/primary5_math.pdf" },
            { id: 503, title: "العلوم - الصف الخامس", author: "وزارة التربية", size: "14.2 MB", type: "PDF", coverIcon: "fa-vial", fileUrl: "books/primary5_science.pdf" },
            { id: 504, title: "الاجتماعيات - الصف الخامس", author: "وزارة التربية", size: "11.8 MB", type: "PDF", coverIcon: "fa-map", fileUrl: "books/primary5_social.pdf" }
          ]},
          { gradeName: "الصف السادس الابتدائي", books: [
            { id: 601, title: "قواعد اللغة العربية - السادس", author: "وزارة التربية", size: "13.0 MB", type: "PDF", coverIcon: "fa-graduation-cap", fileUrl: "books/primary6_arabic.pdf" },
            { id: 602, title: "الرياضيات المطور - السادس", author: "وزارة التربية", size: "15.5 MB", type: "PDF", coverIcon: "fa-square-plus", fileUrl: "books/primary6_math.pdf" },
            { id: 603, title: "العلوم - الصف السادس", author: "وزارة التربية", size: "14.8 MB", type: "PDF", coverIcon: "fa-dna", fileUrl: "books/primary6_science.pdf" },
            { id: 604, title: "الاجتماعيات - الصف السادس", author: "وزارة التربية", size: "12.2 MB", type: "PDF", coverIcon: "fa-map-location-dot", fileUrl: "books/primary6_social.pdf" },
            { id: 605, title: "اللغة الإنجليزية - السادس", author: "وزارة التربية", size: "14.0 MB", type: "PDF", coverIcon: "fa-spell-check", fileUrl: "books/primary6_english.pdf" }
          ]}
        ];

        let primaryData = JSON.parse(localStorage.getItem("libraryData")) || initialPrimaryData;
        let activeGrade = "all";
        let isAuthorizedUser = false;

        function checkPermissions() {
            const storedUser = JSON.parse(localStorage.getItem("currentUser")) || {};
            const storedRole = (storedUser.role || localStorage.getItem("userRole") || "").toLowerCase();

            if (["admin", "teacher", "مدير", "معلم", "أدمن"].includes(storedRole)) {
                isAuthorizedUser = true;
                const fab = document.getElementById("fabAddBook");
                if (fab) fab.style.display = "flex";
            } else {
                isAuthorizedUser = false;
                const fab = document.getElementById("fabAddBook");
                if (fab) fab.style.display = "none";
            }
        }

        function renderLibrary() {
            const container = document.getElementById("sectionsContainer");
            const searchVal = document.getElementById("searchInput").value.toLowerCase();
            container.innerHTML = "";

            let totalMatches = 0;

            primaryData.forEach(gradeGroup => {
                if (activeGrade !== "all" && gradeGroup.gradeName !== activeGrade) {
                    return;
                }

                const filteredBooks = gradeGroup.books.filter(book => 
                    book.title.toLowerCase().includes(searchVal) || book.author.toLowerCase().includes(searchVal)
                );

                if (filteredBooks.length > 0) {
                    totalMatches += filteredBooks.length;

                    const section = document.createElement("div");
                    section.className = "grade-section";

                    let booksHtml = "";
                    filteredBooks.forEach(book => {
                        let deleteBtn = isAuthorizedUser ? 
                            `<button onclick="deleteBook(${book.id})" class="btn-action btn-del" title="حذف الكتاب"><i class="fa-solid fa-trash"></i></button>` : '';

                        booksHtml += `
                            <div class="book-card-horizontal">
                                <div class="book-icon-wrapper">
                                    <i class="fa-solid ${book.coverIcon || 'fa-book'}"></i>
                                </div>
                                <div class="book-info">
                                    <div class="book-title">${book.title}</div>
                                    <div class="book-meta">
                                        <span><i class="fa-solid fa-building-columns"></i> ${book.author}</span>
                                        <span>•</span>
                                        <span><i class="fa-solid fa-file-pdf" style="color:#ef4444;"></i> ${book.type}</span>
                                        <span>•</span>
                                        <span><i class="fa-solid fa-hard-drive"></i> ${book.size}</span>
                                    </div>
                                </div>
                                <div class="book-actions-horizontal">
                                    <a href="${book.fileUrl}" download="${book.title}.pdf" class="btn-action btn-dl">
                                        <i class="fa-solid fa-download"></i> تحميل
                                    </a>
                                    <a href="${book.fileUrl}" target="_blank" class="btn-action btn-pv" title="معاينة">
                                        <i class="fa-solid fa-eye"></i> معاينة
                                    </a>
                                    ${deleteBtn}
                                </div>
                            </div>
                        `;
                    });

                    section.innerHTML = `
                        <h2 class="grade-title"><i class="fa-solid fa-layer-group"></i> ${gradeGroup.gradeName}</h2>
                        <div class="books-list">
                            ${booksHtml}
                        </div>
                    `;

                    container.appendChild(section);
                }
            });

            if (totalMatches === 0) {
                container.innerHTML = `<div style="text-align: center; color: #64748b; background: #ffffff; border-radius: 16px; padding: 40px; border: 1px solid #e2e8f0; font-size: 15px;">لا توجد كتب تطابق خيارات البحث الحالية.</div>`;
            }
        }

        function openModal() {
            document.getElementById("addBookModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("addBookModal").style.display = "none";
        }

        function addNewBook(e) {
            e.preventDefault();
            if (!isAuthorizedUser) return;

            const title = document.getElementById("newBookTitle").value;
            const author = document.getElementById("newBookAuthor").value;
            const gradeName = document.getElementById("newBookGrade").value;
            const size = document.getElementById("newBookSize").value;
            const fileUrl = document.getElementById("newBookUrl").value;

            const targetGrade = primaryData.find(g => g.gradeName === gradeName);
            if (targetGrade) {
                const newBook = {
                    id: Date.now(),
                    title: title,
                    author: author,
                    size: size,
                    type: "PDF",
                    coverIcon: "fa-book-bookmark",
                    fileUrl: fileUrl
                };
                targetGrade.books.push(newBook);
                localStorage.setItem("libraryData", JSON.stringify(primaryData));
                renderLibrary();
                closeModal();
                e.target.reset();
                alert("تم إضافة الكتاب بنجاح إلى المكتبة!");
            }
        }

        function deleteBook(bookId) {
            if (!isAuthorizedUser) return;
            if (confirm("هل أنت متأكد من حذف هذا الكتاب؟")) {
                primaryData.forEach(gradeGroup => {
                    gradeGroup.books = gradeGroup.books.filter(b => b.id !== bookId);
                });
                localStorage.setItem("libraryData", JSON.stringify(primaryData));
                renderLibrary();
            }
        }

        function selectGrade(grade, btn) {
            activeGrade = grade;
            const buttons = document.querySelectorAll(".tab-btn");
            buttons.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            renderLibrary();
        }

        function filterBooks() {
            renderLibrary();
        }

        document.addEventListener("DOMContentLoaded", () => {
            checkPermissions();
            renderLibrary();
        });
    </script>
</body>
</html>
