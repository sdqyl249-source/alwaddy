<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الوادي التعليمية - مكتبة المرحلة الابتدائية</title>
    
    <!-- ⬇️ كود إعلانات Adsterra -->
    <script src="https://pl30567680.effectivecpmnetwork.com/0c/63/61/0c63614dfd4b8d6396d805d790b93258.js"></script>

    <!-- مكتبة الأيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #0284c7;
            --primary-hover: #0369a1;
            --admin-color: #16a34a;
            --admin-hover: #15803d;
            --danger-color: #ef4444;
            --bg-body: #f8fafc;
            --bg-surface: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-md: 12px;
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 12px 24px rgba(0, 0, 0, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); direction: rtl; padding-bottom: 60px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 15px; }

        /* الهيدر */
        header { background-color: var(--bg-surface); border-bottom: 1px solid var(--border-color); padding: 14px 0; box-shadow: var(--shadow-sm); }
        .header-wrapper { display: flex; justify-content: space-between; align-items: center; }
        .brand-logo { display: flex; align-items: center; gap: 8px; color: var(--primary-color); font-size: 18px; font-weight: 800; text-decoration: none; }
        
        .btn-back-platform {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #f1f5f9;
            color: var(--text-main);
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }
        .btn-back-platform:hover { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }

        /* لوحة إضافة الكتب */
        .admin-panel { 
            background: #f0fdf4; 
            border: 1px solid #bbf7d0; 
            border-radius: var(--radius-md); 
            padding: 15px; 
            margin: 20px 0; 
        }
        .admin-title { font-size: 15px; font-weight: 700; color: #166534; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .admin-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 12px; font-weight: 600; color: #14532d; }
        .form-control { padding: 8px 10px; border: 1px solid #86efac; border-radius: 8px; font-size: 13px; background: white; outline: none; }
        .btn-admin { background-color: var(--admin-color); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; grid-column: 1 / -1; font-size: 13px; }
        .btn-admin:hover { background-color: var(--admin-hover); }

        /* قسم الهيدر الداخلي */
        .hero-section { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: white; padding: 25px 15px; border-radius: var(--radius-md); margin-bottom: 25px; text-align: center; }
        .hero-section h2 { font-size: 20px; margin-bottom: 5px; }
        .hero-section p { font-size: 13px; opacity: 0.9; }

        /* شبكة بطاقات الصفوف الدراسية */
        .classes-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 20px; 
        }

        .class-card { 
            background-color: var(--bg-surface); 
            border-radius: 16px; 
            overflow: hidden; 
            box-shadow: var(--shadow-sm); 
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .class-header { 
            padding: 16px; 
            color: white; 
            font-weight: 700; 
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* خلفيات متدرجة للصفوف */
        .class-card[data-class="first"] .class-header { background: linear-gradient(135deg, #ff7e5f, #feb47b); }
        .class-card[data-class="second"] .class-header { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .class-card[data-class="third"] .class-header { background: linear-gradient(135deg, #fc4a1a, #f7b733); }
        .class-card[data-class="fourth"] .class-header { background: linear-gradient(135deg, #8e2de2, #4a00e0); }
        .class-card[data-class="fifth"] .class-header { background: linear-gradient(135deg, #f80759, #bc4e9c); }
        .class-card[data-class="sixth"] .class-header { background: linear-gradient(135deg, #00c6ff, #0072ff); }

        .books-list {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 120px;
            justify-content: center;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            font-style: italic;
        }

        /* عنصر الكتاب داخل الصف */
        .book-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            gap: 10px;
        }

        .book-item-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            word-break: break-word;
        }

        .book-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-download {
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: 0.2s;
        }

        .btn-download:hover { background-color: var(--primary-hover); }

        .btn-delete {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 6px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }

        .btn-delete:hover { background: var(--danger-color); color: white; }
    </style>
</head>
<body>

    <header>
        <div class="container header-wrapper">
            <a href="#" class="brand-logo">
                <i class="fa-solid fa-shapes"></i>
                <span>مكتبة المرحلة الابتدائية</span>
            </a>
            <a href="index.html" class="btn-back-platform">
                <i class="fa-solid fa-house"></i> المنصة الرئيسية
            </a>
        </div>
    </header>

    <main class="container">

        <!-- لوحة إضافة الكتب ظاهر دائماً لتستطيع إضافة الكتب بحرية -->
        <section class="admin-panel">
            <div class="admin-title">
                <i class="fa-solid fa-user-shield"></i> إضافة كتاب جديد إلى أحد الصفوف (PDF)
            </div>
            <form id="addBookForm" class="admin-form" onsubmit="uploadBookFromDevice(event)">
                <div class="form-group">
                    <label>اسم الكتاب / المادة</label>
                    <input type="text" id="bookTitleInput" class="form-control" placeholder="مثال: قراءتي" required>
                </div>
                <div class="form-group">
                    <label>الصف الدراسي</label>
                    <select id="bookClassSelect" class="form-control">
                        <option value="first">الأول الابتدائي</option>
                        <option value="second">الثاني الابتدائي</option>
                        <option value="third">الثالث الابتدائي</option>
                        <option value="fourth">الرابع الابتدائي</option>
                        <option value="fifth">الخامس الابتدائي</option>
                        <option value="sixth">السادس الابتدائي</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>اختر ملف PDF من جهازك</label>
                    <input type="file" id="pdfFileInput" class="form-control" accept="application/pdf" required>
                </div>
                <button type="submit" class="btn-admin">
                    <i class="fa-solid fa-cloud-arrow-up"></i> رفع وحفظ الكتاب في الصف المحدد
                </button>
            </form>
        </section>

        <section class="hero-section">
            <h2>مناهج المرحلة الابتدائية</h2>
            <p>اختر الصف الدراسي لتحميل الكتب والمناهج المتاحة</p>
        </section>

        <!-- شبكة الصفوف الدراسية -->
        <div class="classes-grid" id="classesContainer">
            
            <!-- الصف الأول -->
            <div class="class-card" data-class="first">
                <div class="class-header">
                    <span><i class="fa-solid fa-graduation-cap"></i> الأول الابتدائي</span>
                </div>
                <div class="books-list" id="list-first"></div>
            </div>

            <!-- الصف الثاني -->
            <div class="class-card" data-class="second">
                <div class="class-header">
                    <span><i class="fa-solid fa-graduation-cap"></i> الثاني الابتدائي</span>
                </div>
                <div class="books-list" id="list-second"></div>
            </div>

            <!-- الصف الثالث -->
            <div class="class-card" data-class="third">
                <div class="class-header">
                    <span><i class="fa-solid fa-graduation-cap"></i> الثالث الابتدائي</span>
                </div>
                <div class="books-list" id="list-third"></div>
            </div>

            <!-- الصف الرابع -->
            <div class="class-card" data-class="fourth">
                <div class="class-header">
                    <span><i class="fa-solid fa-graduation-cap"></i> الرابع الابتدائي</span>
                </div>
                <div class="books-list" id="list-fourth"></div>
            </div>

            <!-- الصف الخامس -->
            <div class="class-card" data-class="fifth">
                <div class="class-header">
                    <span><i class="fa-solid fa-graduation-cap"></i> الخامس الابتدائي</span>
                </div>
                <div class="books-list" id="list-fifth"></div>
            </div>

            <!-- الصف السادس -->
            <div class="class-card" data-class="sixth">
                <div class="class-header">
                    <span><i class="fa-solid fa-graduation-cap"></i> السادس الابتدائي</span>
                </div>
                <div class="books-list" id="list-sixth"></div>
            </div>

        </div>

    </main>

    <script>
        const STORAGE_KEY = 'alwaddy_primary_books_v2';
        const classKeys = ['first', 'second', 'third', 'fourth', 'fifth', 'sixth'];

        document.addEventListener('DOMContentLoaded', loadSavedBooks);

        function getStoredBooks() {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored ? JSON.parse(stored) : []; // قائمة فارغة افتراضياً
        }

        function loadSavedBooks() {
            renderBooks();
        }

        function renderBooks() {
            const books = getStoredBooks();
            
            // تفريغ كافة القوائم أولاً
            classKeys.forEach(key => {
                const listElem = document.getElementById(`list-${key}`);
                if (listElem) listElem.innerHTML = '';
            });

            // توزيع الكتب على القوائم بحسب الصف
            classKeys.forEach(key => {
                const listElem = document.getElementById(`list-${key}`);
                const classBooks = books.filter(b => b.category === key);

                if (classBooks.length === 0) {
                    listElem.innerHTML = `<div class="empty-msg">لا توجد كتب مضافة لهذا الصف حالياً.</div>`;
                } else {
                    classBooks.forEach(book => {
                        const bookItem = document.createElement('div');
                        bookItem.className = 'book-item';
                        bookItem.innerHTML = `
                            <div class="book-item-title">
                                <i class="fa-solid fa-file-pdf" style="color: #ef4444;"></i>
                                <span>${book.title}</span>
                            </div>
                            <div class="book-actions">
                                <a href="${book.fileData}" download="${book.title}.pdf" class="btn-download">
                                    <i class="fa-solid fa-download"></i> تحميل
                                </a>
                                <button onclick="deleteBook(${book.id})" class="btn-delete" title="حذف الكتاب">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        `;
                        listElem.appendChild(bookItem);
                    });
                }
            });
        }

        function uploadBookFromDevice(event) {
            event.preventDefault();

            const title = document.getElementById('bookTitleInput').value.trim();
            const category = document.getElementById('bookClassSelect').value;
            const fileInput = document.getElementById('pdfFileInput');

            if (fileInput.files.length === 0) {
                alert("يرجى اختيار ملف PDF من جهازك أولاً!");
                return;
            }

            const file = fileInput.files[0];
            
            // تنبيه حجم الملف لحفظ المساحة
            if (file.size > 5 * 1024 * 1024) { 
                alert("حجم الملف كبير جداً للتخزين المحلي. يرجى اختيار ملف بحجم أقل من 5 ميغابايت.");
                return;
            }

            const reader = new FileReader();

            reader.onload = function(e) {
                const fileBase64 = e.target.result;
                const newBook = {
                    id: Date.now(),
                    title: title,
                    category: category,
                    fileData: fileBase64
                };

                const currentBooks = getStoredBooks();
                currentBooks.unshift(newBook);

                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(currentBooks));
                    renderBooks();
                    document.getElementById('addBookForm').reset();
                    alert("تمت إضافة الكتاب بنجاح للبطاقة الخاصة به!");
                } catch (err) {
                    alert("تعذر الحفظ: مساحة التخزين المحلية ممتلئة. حاول حذف بعض الكتب القديمة.");
                }
            };

            reader.readAsDataURL(file);
        }

        function deleteBook(bookId) {
            if (confirm("هل أنت متأكد من رغبتك في حذف هذا الكتاب؟")) {
                let currentBooks = getStoredBooks();
                currentBooks = currentBooks.filter(b => b.id !== bookId);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(currentBooks));
                renderBooks();
            }
        }
    </script>
    <script src="https://pl30567936.effectivecpmnetwork.com/75/71/e0/7571e0e12a8e91b91d02f47ecb8b87ea.js"></script>
</body>
</html>
