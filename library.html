<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الوادي التعليمية - مكتبة المرحلة الابتدائية</title>
    
    <!-- ⬇️ كود إعلانات Adsterra الخاص بك ⬇️ -->
    <script src="https://pl30567680.effectivecpmnetwork.com/0c/63/61/0c63614dfd4b8d6396d805d790b93258.js"></script>

    <!-- مكتبة الأيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #0284c7;
            --primary-hover: #0369a1;
            --admin-color: #16a34a;
            --admin-hover: #15803d;
            --danger-color: #ef4444;
            --bg-body: #f8fafc;
            --bg-surface: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-md: 12px;
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 12px 24px rgba(0, 0, 0, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); direction: rtl; padding-bottom: 60px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 15px; }

        /* الهيدر والربط بالمنصة */
        header { background-color: var(--bg-surface); border-bottom: 1px solid var(--border-color); padding: 14px 0; box-shadow: var(--shadow-sm); }
        .header-wrapper { display: flex; justify-content: space-between; align-items: center; }
        .brand-logo { display: flex; align-items: center; gap: 8px; color: var(--primary-color); font-size: 18px; font-weight: 800; text-decoration: none; }
        
        .btn-back-platform {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #f1f5f9;
            color: var(--text-main);
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }
        .btn-back-platform:hover { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }

        /* لوحة إضافة الكتب */
        .admin-panel { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: var(--radius-md); padding: 15px; margin: 20px 0; }
        .admin-title { font-size: 15px; font-weight: 700; color: #166534; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .admin-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 12px; font-weight: 600; color: #14532d; }
        .form-control { padding: 8px 10px; border: 1px solid #86efac; border-radius: 8px; font-size: 13px; background: white; outline: none; }
        .btn-admin { background-color: var(--admin-color); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; grid-column: 1 / -1; font-size: 13px; }
        .btn-admin:hover { background-color: var(--admin-hover); }

        /* قسم البحث والفلترة */
        .hero-section { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: white; padding: 25px 15px; border-radius: var(--radius-md); margin-bottom: 20px; text-align: center; }
        .hero-section h2 { font-size: 20px; margin-bottom: 5px; }
        .hero-section p { font-size: 13px; opacity: 0.9; }
        .search-input { width: 100%; max-width: 450px; padding: 10px 16px; border-radius: 20px; border: none; outline: none; font-size: 13px; margin-top: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        .categories-filter { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
        .filter-btn { background-color: var(--bg-surface); border: 1px solid var(--border-color); padding: 6px 14px; border-radius: 18px; font-size: 12px; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
        .filter-btn.active, .filter-btn:hover { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }

        /* 🎨 شبكة الكتب والبطاقات الصغيرة التفاعلية والملونة */
        .books-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 15px; 
        }

        .book-card { 
            background-color: var(--bg-surface); 
            border-radius: 14px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            box-shadow: var(--shadow-sm); 
            border: 1px solid var(--border-color);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }

        /* تفاعل البطاقة عند التمرير عليها */
        .book-card:hover { 
            transform: translateY(-6px) scale(1.02); 
            box-shadow: var(--shadow-hover);
        }

        /* ترويسة ملونة لكل صف دراسي */
        .book-thumbnail { 
            height: 90px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            font-size: 38px; 
            position: relative; 
            transition: all 0.3s ease;
        }

        /* ألوان متدرجة تفاعلية حسب الصف */
        .book-card[data-category="first"] .book-thumbnail { background: linear-gradient(135deg, #ff7e5f, #feb47b); }
        .book-card[data-category="second"] .book-thumbnail { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .book-card[data-category="third"] .book-thumbnail { background: linear-gradient(135deg, #fc4a1a, #f7b733); }
        .book-card[data-category="fourth"] .book-thumbnail { background: linear-gradient(135deg, #8e2de2, #4a00e0); }
        .book-card[data-category="fifth"] .book-thumbnail { background: linear-gradient(135deg, #f80759, #bc4e9c); }
        .book-card[data-category="sixth"] .book-thumbnail { background: linear-gradient(135deg, #00c6ff, #0072ff); }

        .book-badge { 
            position: absolute; 
            top: 8px; 
            right: 8px; 
            background: rgba(0, 0, 0, 0.25); 
            backdrop-filter: blur(4px);
            color: white; 
            padding: 3px 8px; 
            border-radius: 12px; 
            font-size: 10px; 
            font-weight: 700; 
        }

        .book-content { 
            padding: 12px; 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            gap: 10px;
        }

        .book-title { 
            font-size: 13px; 
            font-weight: 700; 
            color: var(--text-main);
            line-height: 1.3;
            text-align: center;
        }
        
        /* زر التحميل الملون المصغر */
        .btn-download-direct { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 6px; 
            width: 100%; 
            background-color: var(--primary-color); 
            color: white; 
            text-decoration: none; 
            padding: 7px; 
            border-radius: 8px; 
            font-weight: 700; 
            font-size: 12px; 
            border: none; 
            cursor: pointer; 
            transition: all 0.2s;
        }

        .btn-download-direct:hover { 
            background-color: var(--primary-hover); 
            box-shadow: 0 4px 8px rgba(2, 132, 199, 0.3);
        }

        .btn-delete { 
            background: rgba(239, 68, 68, 0.1); 
            color: var(--danger-color); 
            border: 1px solid rgba(239, 68, 68, 0.2); 
            padding: 4px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 11px; 
            width: 100%; 
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background: var(--danger-color);
            color: white;
        }
    </style>
</head>
<body>

    <!-- الهيدر والعودة للمنصة -->
    <header>
        <div class="container header-wrapper">
            <a href="#" class="brand-logo">
                <i class="fa-solid fa-shapes"></i>
                <span>مكتبة المرحلة الابتدائية</span>
            </a>
            <a href="index.html" class="btn-back-platform">
                <i class="fa-solid fa-house"></i> المنصة الرئيسية
            </a>
        </div>
    </header>

    <main class="container">

        <!-- 🛡️ لوحة إضافة كتب جديدة مع التخزين الثابت -->
        <section class="admin-panel">
            <div class="admin-title">
                <i class="fa-solid fa-user-shield"></i> إضافة كتاب جديد من الجهاز (حفظ دائم)
            </div>
            <form id="addBookForm" class="admin-form" onsubmit="uploadBookFromDevice(event)">
                <div class="form-group">
                    <label>اسم الكتاب / المادة</label>
                    <input type="text" id="bookTitleInput" class="form-control" placeholder="مثال: قراءتي - الأول الابتدائي" required>
                </div>
                <div class="form-group">
                    <label>الصف الدراسي</label>
                    <select id="bookClassSelect" class="form-control">
                        <option value="first">الأول الابتدائي</option>
                        <option value="second">الثاني الابتدائي</option>
                        <option value="third">الثالث الابتدائي</option>
                        <option value="fourth">الرابع الابتدائي</option>
                        <option value="fifth">الخامس الابتدائي</option>
                        <option value="sixth">السادس الابتدائي</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>اختر ملف PDF من جهازك</label>
                    <input type="file" id="pdfFileInput" class="form-control" accept="application/pdf" required>
                </div>
                <button type="submit" class="btn-admin">
                    <i class="fa-solid fa-cloud-arrow-up"></i> رفع وحفظ الكتاب دائماً
                </button>
            </form>
        </section>

        <!-- البحث والمرحلة الابتدائية -->
        <section class="hero-section">
            <h2>مناهج المرحلة الابتدائية</h2>
            <p>بطاقات تفاعلية وسريعة لتحميل الكتب فوراً</p>
            <input type="text" id="searchInput" onkeyup="filterBooks()" class="search-input" placeholder="ابحث عن اسم الكتاب...">
        </section>

        <!-- فلترة الصفوف -->
        <div class="categories-filter">
            <button class="filter-btn active" onclick="filterCategory('all', event)">الكل</button>
            <button class="filter-btn" onclick="filterCategory('first', event)">الأول</button>
            <button class="filter-btn" onclick="filterCategory('second', event)">الثاني</button>
            <button class="filter-btn" onclick="filterCategory('third', event)">الثالث</button>
            <button class="filter-btn" onclick="filterCategory('fourth', event)">الرابع</button>
            <button class="filter-btn" onclick="filterCategory('fifth', event)">الخامس</button>
            <button class="filter-btn" onclick="filterCategory('sixth', event)">السادس</button>
        </div>

        <!-- شبكة عرض الكتب الصغيرة الملونة والتفاعلية -->
        <div class="books-grid" id="booksContainer"></div>

    </main>

    <script>
        const STORAGE_KEY = 'alwaddy_primary_books';

        const classNames = {
            'first': 'الأول الابتدائي',
            'second': 'الثاني الابتدائي',
            'third': 'الثالث الابتدائي',
            'fourth': 'الرابع الابتدائي',
            'fifth': 'الخامس الابتدائي',
            'sixth': 'السادس الابتدائي'
        };

        const defaultBooks = [
            { id: 1, title: 'قراءتي للصف الأول', category: 'first', fileData: '#' },
            { id: 2, title: 'الرياضيات للصف الثاني', category: 'second', fileData: '#' },
            { id: 3, title: 'العلوم للصف الثالث', category: 'third', fileData: '#' },
            { id: 4, title: 'القراءة للصف الرابع', category: 'fourth', fileData: '#' },
            { id: 5, title: 'الإسلامية للصف الخامس', category: 'fifth', fileData: '#' },
            { id: 6, title: 'الرياضيات للصف السادس', category: 'sixth', fileData: '#' }
        ];

        document.addEventListener('DOMContentLoaded', loadSavedBooks);

        function getStoredBooks() {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored ? JSON.parse(stored) : defaultBooks;
        }

        function loadSavedBooks() {
            const books = getStoredBooks();
            const container = document.getElementById('booksContainer');
            container.innerHTML = '';

            books.forEach(book => {
                const bookCard = document.createElement('div');
                bookCard.className = 'book-card';
                bookCard.setAttribute('data-category', book.category);

                bookCard.innerHTML = `
                    <div class="book-thumbnail">
                        <span class="book-badge">${classNames[book.category] || 'ابتدائي'}</span>
                        <i class="fa-solid fa-book-bookmark"></i>
                    </div>
                    <div class="book-content">
                        <h3 class="book-title">${book.title}</h3>
                        <a href="${book.fileData}" download="${book.title}.pdf" class="btn-download-direct">
                            <i class="fa-solid fa-download"></i> تحميل
                        </a>
                        ${book.isUserAdded ? `<button onclick="deleteBook(${book.id})" class="btn-delete"><i class="fa-solid fa-trash"></i> حذف</button>` : ''}
                    </div>
                `;
                container.appendChild(bookCard);
            });
        }

        function uploadBookFromDevice(event) {
            event.preventDefault();

            const title = document.getElementById('bookTitleInput').value;
            const category = document.getElementById('bookClassSelect').value;
            const fileInput = document.getElementById('pdfFileInput');

            if (fileInput.files.length === 0) {
                alert("يرجى اختيار ملف PDF من جهازك أولاً!");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                const fileBase64 = e.target.result;
                const newBook = {
                    id: Date.now(),
                    title: title,
                    category: category,
                    fileData: fileBase64,
                    isUserAdded: true
                };

                const currentBooks = getStoredBooks();
                currentBooks.unshift(newBook);

                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(currentBooks));
                    loadSavedBooks();
                    document.getElementById('addBookForm').reset();
                    alert("تم حفظ الكتاب بنجاح وبشكل دائم!");
                } catch (err) {
                    alert("حجم الملف كبير جداً. يرجى رفع ملف بحجم أقل من 5 ميغابايت.");
                }
            };

            reader.readAsDataURL(file);
        }

        function deleteBook(bookId) {
            if (confirm("هل أنت تأكد من رغبتك في حذف هذا الكتاب؟")) {
                let currentBooks = getStoredBooks();
                currentBooks = currentBooks.filter(b => b.id !== bookId);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(currentBooks));
                loadSavedBooks();
            }
        }

        function filterBooks() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.getElementsByClassName('book-card');

            for (let card of cards) {
                const title = card.querySelector('.book-title').innerText.toLowerCase();
                card.style.display = title.includes(input) ? "flex" : "none";
            }
        }

        function filterCategory(category, event) {
            const cards = document.getElementsByClassName('book-card');
            const buttons = document.getElementsByClassName('filter-btn');

            for (let btn of buttons) btn.classList.remove('active');
            if (event) event.target.classList.add('active');

            for (let card of cards) {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
